# Tag-triggered release, the shared implementation: goreleaser cuts the
# GitHub release and its changelog and builds the promotion-gate and
# webhook-relay images with ko
# (see .goreleaser.yaml), and each chart is then packaged at the tag's version
# and pushed to oci://ghcr.io/truvity/charts/<name>.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish: a half-pushed artifact set is worse than a
# queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@690acf2363bb57e0af99d62bfe88c894a8f68f0a # v5.9.0
    with:
      charts: '["cd-argocd", "cd-kargo", "cd-rollouts", "cd-delivery", "cd-company", "cd-pipeline", "cd-cluster-registration", "cd-webhook-relay"]'
      # Three of these charts package software we do not build: appVersion
      # keeps recording the upstream release (hack/check-app-version.sh holds
      # it to the vendored archive), while version is the tag. cd-delivery,
      # cd-company, cd-pipeline, cd-cluster-registration and cd-webhook-relay
      # have no upstream and no appVersion.
      chart-app-version: chart
      # ko names each image after its cmd directory (base_import_paths in
      # .goreleaser.yaml), so this nests them as ghcr.io/truvity/cd/promotion-gate
      # and ghcr.io/truvity/cd/webhook-relay.
      ko-docker-repo: ghcr.io/truvity/cd
