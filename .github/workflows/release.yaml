# Tag-triggered release, the shared implementation. Chart-only: goreleaser
# cuts the GitHub release and its changelog (builds are skipped, see
# .goreleaser.yaml), and each chart is then packaged at the tag's version and
# pushed to oci://ghcr.io/truvity/charts/<name>.
#
# The caller grants the permissions because a reusable workflow can narrow
# them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish: a half-pushed artifact set is worse than a
# queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@822f94031ee2c91b76da8d5071bfb3d1b6af27b7 # v3.19.0
    with:
      charts: '["cd-argocd", "cd-kargo", "cd-rollouts", "cd-delivery"]'
      # Three of these charts package software we do not build: appVersion
      # keeps recording the upstream release (hack/check-app-version.sh holds
      # it to the vendored archive), while version is the tag. cd-delivery
      # has no upstream and no appVersion.
      chart-app-version: chart
