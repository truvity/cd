---
# Source: cd-company/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-example-service-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: example-service
  project: example-service-east
  sources:
  - helm:
      releaseName: example-service-infra
      valuesObject:
        events:
          account: example-service
          maxAge: 24h
          replicas: 1
          storage: file
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: example-service-pg-runtime
          runtimeRole: example_service_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/example-service-infra
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

---
# Source: cd-company/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-example-service
  namespace: argocd
spec:
  destination:
    name: east
    namespace: example-service
  project: example-service-east
  sources:
  - helm:
      releaseName: example-service
      valuesObject:
        config:
          greeting: hello
        database:
          app:
            passwordSecret: example-service-pg-runtime
            role: example_service_app
          host: example-service-infra-pg-rw
          owner:
            passwordSecret: example-service-infra-pg-app
        events:
          url: nats://broker.example:4222
        greeting: platform
        route:
          enabled: true
          hostname: example-service.example.com
        serviceAccount:
          app:
            name: example-service
        tuning:
          burst: 5
          replicas: 3
    path: .
    repoURL: oci://registry.example.com/charts/example-service
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

