# Source: cd-company/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: stage-example-service-e2e
  namespace: argocd
spec:
  destination:
    name: stage
    namespace: example-service
  project: example-service-stage
  sources:
  - helm:
      releaseName: example-service-e2e
      valuesObject:
        appRelease: example-service
        archive:
          bucket: stage-example-service
          region: example-region
        config:
          timeout: 30s
        database:
          app:
            passwordSecret: example-service-pg-runtime
            role: example_service_app
          host: example-service-infra-pg-rw
          name: example_service
          owner:
            role: example_service_owner
        events:
          url: nats://broker.example.com:4222
        job:
          annotations:
            argocd.argoproj.io/sync-options: Force=true,Replace=true
        mode: full
        prober:
          enabled: true
          interval: 30s
        serviceAccount:
          create: true
          name: example-service-e2e
    path: .
    repoURL: oci://registry.example.com/charts/example-service-e2e
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

