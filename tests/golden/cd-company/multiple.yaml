apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: stage-example-service
  namespace: argocd
spec:
  destination:
    name: stage
    namespace: example-service
  project: example-service-stage
  sources:
  - helm:
      releaseName: example-service
      valuesObject:
        archive:
          bucket:
            name: stage-example-service
            region: example-region
        availability: high
        config:
          greeting: hello
        database:
          app:
            passwordSecret: example-service-pg-runtime
            role: example_service_app
          host: example-service-infra-pg-rw
        events:
          url: nats://broker.example.com:4222
        installName: example-service
        route:
          enabled: true
          hostname: example-service.example.com
        serviceAccount:
          app:
            name: example-service
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/example-service
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

