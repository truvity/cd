# Source: cd-company/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: stage-example-service-infra
  namespace: argocd
spec:
  destination:
    name: stage
    namespace: example-service
  project: example-service-stage
  sources:
  - helm:
      releaseName: example-service-infra
      valuesObject:
        cloud:
          accountID: EXAMPLE_ACCOUNT
          bucket: stage-example-service
          clusterName: stage
          iamName: stage-example-service
          region: example-region
          serviceAccount: example-service
        events:
          account: example-service
          maxAge: 24h
          replicas: 2
          storage: file
        installName: example-service
        postgres:
          instances: 2
          parameters:
            max_connections: "100"
          runtimePassword:
            generate: true
          runtimePasswordSecret: example-service-pg-runtime
          runtimeRole: example_service_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/example-service-infra
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

