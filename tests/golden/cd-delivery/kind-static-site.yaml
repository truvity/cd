# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    example.com/sync-gating: "true"
  name: east-blog-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: blog
  project: blog-east
  sources:
  - helm:
      releaseName: blog
      valuesObject:
        fullnameOverride: blog
        installName: blog
        serviceAccount:
          name: blog
    path: .
    repoURL: oci://registry.example.com/other/static-site-infra
    targetRevision: 3.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

