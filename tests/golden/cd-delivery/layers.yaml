apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-shop-applied
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop-applied
  project: shop-applied-east
  sources:
  - helm:
      releaseName: shop-applied
      valuesObject:
        database:
          app:
            passwordSecret: shop-applied-pg-runtime
            role: shop_applied_app
          host: shop-applied-infra-pg-rw
          owner:
            passwordSecret: shop-applied-infra-pg-app
        events:
          url: nats://broker.example:4222
        replicaCount: 2
        route:
          enabled: true
          hostname: shop.example.com
        serviceAccount:
          app:
            name: shop-applied
        tuning:
          a: product
          mode: layer-two
    path: .
