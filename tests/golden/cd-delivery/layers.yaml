---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-shop-applied-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop-applied
  project: shop-applied-east
  sources:
  - helm:
      releaseName: shop-applied-infra
      valuesObject:
        events:
          account: shop-applied
          maxAge: 24h
          replicas: 1
          storage: file
        layered: true
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-applied-pg-runtime
          runtimeRole: shop_applied_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-applied-infra
    targetRevision: 1.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

