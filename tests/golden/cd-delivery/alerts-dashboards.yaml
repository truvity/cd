---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-cart-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: cart
  project: cart-east
  sources:
  - helm:
      releaseName: cart-infra
      valuesObject:
        events:
          account: cart
          maxAge: 24h
          replicas: 1
          storage: file
        installName: cart
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: cart-pg-runtime
          runtimeRole: cart_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/cart-infra
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

