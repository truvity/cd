---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-docs-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: docs
  project: docs-east
  sources:
  - helm:
      releaseName: docs
      valuesObject:
        fullnameOverride: docs
        installName: docs
        serviceAccount:
          name: docs
    path: .
    repoURL: oci://registry.example.com/charts/static-site-infra
    targetRevision: 3.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-docs
  namespace: argocd
spec:
  destination:
    name: east
    namespace: docs
  project: docs-east
  sources:
  - helm:
      releaseName: docs
      valuesObject:
        fullnameOverride: docs
        serviceAccount:
          name: docs
        site:
          artifact:
            digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            ref: registry.example.com:5000/site
    path: .
    repoURL: oci://registry.example.com/charts/static-site
    targetRevision: 3.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false
