---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-ledger-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shared-globex
  project: ledger-east
  revisionHistoryLimit: 3
  sources:
  - helm:
      releaseName: ledger-infra
      valuesObject:
        events:
          account: ledger
          maxAge: 24h
          replicas: 1
          storage: file
        installName: ledger
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: ledger-pg-runtime
          runtimeRole: ledger_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/ledger-infra
    targetRevision: 2.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

