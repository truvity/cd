# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-ledger
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shared-globex
  project: ledger-east
  revisionHistoryLimit: 3
  sources:
  - helm:
      releaseName: ledger
      valuesObject:
        database:
          app:
            passwordSecret: ledger-pg-runtime
            role: ledger_app
          host: ledger-infra-pg-rw
        events:
          url: nats://broker.example:4222
        installName: ledger
        route:
          enabled: true
          hostname: portal.globex.example.com
          parentRef:
            group: gateway.networking.k8s.io
            kind: ListenerSet
            name: shared-globex-portal
            namespace: gateways
          pathPrefix: /ledger/
        serviceAccount:
          app:
            name: ledger
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/ledger
    targetRevision: 2.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

