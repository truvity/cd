---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-tool
  namespace: argocd
spec:
  destination:
    name: east
    namespace: tool
  project: tool-east
  sources:
  - chart: tool-chart
    helm:
      releaseName: tool
      valuesObject:
        logLevel: info
    repoURL: https://charts.example.com
    targetRevision: 2.3.4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false
