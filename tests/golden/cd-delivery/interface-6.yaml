---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: west-shop-infra
  namespace: argocd
spec:
  destination:
    name: west
    namespace: shop
  project: shop-west
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        cloud:
          accountID: example-account
          bucket: example-west-sh-shop
          clusterName: west
          iamName: west-sh-shop
          region: example-region-1
          serviceAccount: shop
        events:
          account: shop
          maxAge: 24h
          replicas: 1
          storage: file
        installName: shop
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          serverTLS:
            caSecretName: shop-infra-pg-server-ca
            secretName: shop-infra-pg-server-tls
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-infra
    targetRevision: 2.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

