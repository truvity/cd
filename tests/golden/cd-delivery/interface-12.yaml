# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    example.com/layer: delivery
    example.com/product: shop
    example.com/sync-gating: "false"
  name: east-shop-e2e
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  project: shop-east
  sources:
  - helm:
      releaseName: shop-e2e
      valuesObject:
        appRelease: shop
        archive:
          bucket: example-east-sh-shop
          region: example-region-1
        database:
          app:
            passwordSecret: shop-pg-runtime
            role: shop_app
          host: shop-infra-pg-rw
          name: shop
          owner:
            role: shop_owner
        events:
          requestSubject: shop-shop.request
          stream: shop-shop-events
        job:
          annotations:
            argocd.argoproj.io/sync-options: Force=true,Replace=true
        mode: full
        otel:
          endpoint: http://collector.example:4318
          sampleRatio: "1.0"
        prober:
          enabled: true
          interval: 30s
          serviceAccount:
            name: shop-e2e-prober
        serviceAccount:
          create: true
          name: shop-e2e
        tls:
          grantRequest: false
          mode: permissive
          peers:
          - namespace: shop
            serviceAccount: shop-api
          - namespace: shop
            serviceAccount: shop-web
          trustDomain: east.example
        traces:
          caConfigMap: private-ca
          tokenExchange:
            audience: issuer
            client: trace-reader
            tokenURL: https://issuer.example/token
          url: https://traces.example/select/jaeger
    path: .
    repoURL: oci://registry.example.com/charts/shop-e2e
    targetRevision: 2.4.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false
