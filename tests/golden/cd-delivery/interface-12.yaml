# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    example.com/layer: delivery
    example.com/product: shop
    example.com/sync-gating: "false"
  name: east-shop
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  ignoreDifferences:
  - group: example.com
    jqPathExpressions:
    - .spec.groups[]?.rules[]?.record
    kind: Rule
  project: shop-east
  sources:
  - helm:
      releaseName: shop
      valuesObject:
        access:
          audience: shop-east
          issuer: https://issuer.example
          signOutUrl: /oauth2/sign_out
        alerts:
          alertLabels:
            example.com/product: shop
          enabled: true
          journeyFailing:
            for: 10m
            ratio: 0.5
          ruleLabels:
            example.com/team: shop
        archive:
          bucket:
            name: example-east-sh-shop
            region: example-region-1
        database:
          app:
            passwordSecret: shop-pg-runtime
            role: shop_app
          host: shop-infra-pg-rw
          owner:
            passwordSecret: shop-infra-pg-app
          tls:
            mode: verify-full
            rootCA:
              configMapName: private-ca
              key: ca-certificates.crt
        events:
          auth:
            audience: broker
          tls:
            caConfigMap: private-ca
            enabled: true
            serverName: broker.east.example
          url: nats://broker.example:4222
        installName: shop
        otel:
          endpoint: http://collector.example:4318
          sampleRatio: "1.0"
        product:
          mode: demo
        replicas: 2
        route:
          annotations:
            example.com/note: merged-last
          enabled: true
          faro:
            backend:
              name: faro-receiver
              namespace: rum
              port: 12347
            enabled: true
            path: /faro/collect
            requestBufferLimit: 256Ki
            rewritePath: /collect
            ruleName: faro
          hostname: shop.example.com
          parentRef:
            group: gateway.networking.k8s.io
            kind: ListenerSet
            name: shop
            namespace: gateways
          surfaces:
          - hostname: admin.shop.example.com
            name: admin
            parentRef:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: shop
              namespace: gateways
        serviceAccount:
          app:
            name: shop
        tls:
          components:
            api:
              mode: strict
          grantRequest: false
          mode: permissive
          peers:
            api:
            - namespace: shop
              serviceAccount: shop-e2e-prober
          trustDomain: east.example
        web:
          faro:
            apiKey: example-public-key
            enabled: true
            environment: east
            sampleRate: 1
    path: .
    repoURL: oci://registry.example.com/charts/shop
    targetRevision: 2.4.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

