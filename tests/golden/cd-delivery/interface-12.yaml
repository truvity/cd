    example.com/sync-gating: "false"
  name: east-shop-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  project: shop-east
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        cloud:
          accountID: example-account
          bucket: example-east-sh-shop
          clusterName: east
          iamName: east-sh-shop
          permissionsBoundary: example-boundary
          region: example-region-1
          serviceAccount: shop
        events:
          account: shop
          maxAge: 24h
          replicas: 3
          storage: file
        installName: shop
        postgres:
          backup:
            objectStoreName: shop-objectstore
            serverName: shop-pg-g2
          instances: 2
