            example.com/product: shop
          platformOwned: true
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          scheduling:
            nodeSelector:
              example.com/pool: durable
            tolerations:
            - effect: NoSchedule
              key: durable
              operator: Equal
              value: "true"
          serverTLS:
            caSecretName: shop-infra-pg-server-ca
            secretName: shop-infra-pg-server-tls
          storage: 20Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-infra
    targetRevision: 2.4.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

