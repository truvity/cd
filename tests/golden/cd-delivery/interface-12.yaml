apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    example.com/layer: delivery
    example.com/product: atlas
    example.com/sync-gating: "false"
  name: east-atlas-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: atlas
  project: atlas-east
  sources:
  - helm:
      releaseName: atlas-infra
      valuesObject:
        events:
          account: atlas
          maxAge: 24h
          replicas: 3
          storage: file
        installName: atlas
        postgres:
          instances: 2
          labels:
            example.com/product: atlas
          runtimePassword:
            generate: true
          runtimePasswordSecret: atlas-pg-runtime
          runtimeRole: atlas_app
          scheduling:
            nodeSelector:
              example.com/pool: durable
            tolerations:
            - effect: NoSchedule
              key: durable
              operator: Equal
              value: "true"
          storage: 20Gi
        tier: primary
    path: .
    repoURL: oci://other.example.com/charts/atlas-infra
    targetRevision: 0.9.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

