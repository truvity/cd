---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-shop-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  project: shop-east
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        events:
          account: shop
          maxAge: 24h
          replicas: 1
          storage: file
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-infra
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

---
# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-shop
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  project: shop-east
  sources:
  - helm:
      releaseName: shop
      valuesObject:
        database:
          app:
            passwordSecret: shop-pg-runtime
            role: shop_app
          host: shop-infra-pg-rw
          owner:
            passwordSecret: shop-infra-pg-app
        events:
          url: nats://broker.example:4222
        route:
          enabled: true
          hostname: shop.example.com
        serviceAccount:
          app:
            name: shop
    path: .
    repoURL: oci://registry.example.com/charts/shop
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false
