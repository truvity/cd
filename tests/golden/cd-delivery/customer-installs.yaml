# Source: cd-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    acme.example.com/installation: acme-globex-shop-globex
  name: east-globex-shop
  namespace: cd-acme-shop
spec:
  destination:
    name: east
    namespace: shop-globex
  project: shop-east-globex
  sources:
  - helm:
      releaseName: shop-globex
      valuesObject:
        database:
          app:
            passwordSecret: shop-globex-pg-runtime
            role: shop_globex_app
          host: shop-globex-infra-pg-rw
          owner:
            passwordSecret: shop-globex-infra-pg-app
        events:
          url: nats://broker.example:4222
        route:
          enabled: true
          hostname: globex.shop.example.com
        serviceAccount:
          app:
            name: shop-globex
    path: .
    repoURL: oci://registry.example.com/charts/shop
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

