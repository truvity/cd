# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    acme.example.com/project: shop
  name: dev-shop-infra
  namespace: delivery
spec:
  destination:
    name: dev
    namespace: shop
  project: shop-dev
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        cloud:
          accountID: EXAMPLE_ACCOUNT
          bucket: dev-shop
          clusterName: dev
          iamName: dev-shop
          region: example-region
          serviceAccount: shop
        events:
          account: shop
          maxAge: 24h
          replicas: 1
          storage: file
        installName: shop
        postgres:
          instances: 1
          parameters:
            max_connections: "100"
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://charts.example.com/acme/shop-infra
    targetRevision: 1.4.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

