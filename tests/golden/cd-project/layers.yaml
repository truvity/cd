# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: shop
  namespace: shop
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - chart:
      discoveryLimit: 20
      repoURL: oci://registry.example.com/charts/shop
      semverConstraint: '>=0.9.0'
