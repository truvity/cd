# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: east-shop-infra
  namespace: argocd
spec:
  destination:
    name: east
    namespace: shop
  project: shop-east
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        events:
          account: shop
          maxAge: 24h
          replicas: 1
          storage: file
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-infra
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

