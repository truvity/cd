---
# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: dev-shop-infra
  namespace: argocd
spec:
  destination:
    name: dev
    namespace: shop
  project: shop-dev
  sources:
  - helm:
      releaseName: shop-infra
      valuesObject:
        events:
          account: shop
          maxAge: 24h
          replicas: 1
          storage: file
        installName: shop
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-pg-runtime
          runtimeRole: shop_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-infra
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

---
# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: dev-shop
  namespace: argocd
spec:
  destination:
    name: dev
    namespace: shop
  project: shop-dev
  sources:
  - helm:
      releaseName: shop
      valuesObject:
        config:
          greeting: hello
        database:
          app:
            passwordSecret: shop-pg-runtime
            role: shop_app
          host: shop-infra-pg-rw
        events:
          url: nats://broker.example.com:4222
        installName: shop
        route:
          enabled: true
          hostname: shop.dev.example.com
        serviceAccount:
          app:
            name: shop
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop
    targetRevision: 1.2.3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

---
# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop
  namespace: shop
spec:
  promotionPolicies:
  - autoPromotionEnabled: true
    stage: dev

---
# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev
  namespace: shop
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/pins/dev.yaml
          updates:
          - key: pins.dev
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote shop ${{ chartFrom(vars.chartRepo).Version }} to
            dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/shop-delivery.git
      - name: chartRepo
        value: oci://registry.example.com/charts/shop
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop
    sources:
      direct: true


---
# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: shop
  namespace: shop
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - chart:
      discoveryLimit: 20
      repoURL: oci://registry.example.com/charts/shop
      semverConstraint: '>=1.0.0 <2.0.0'
