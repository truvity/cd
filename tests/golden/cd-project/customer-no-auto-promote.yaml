# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    acme.example.com/customer: globex
  name: dev-globex-shop-infra
  namespace: cd-acme-shop
spec:
  destination:
    name: dev
    namespace: shop-globex
  project: dev-globex-shop
  sources:
  - helm:
      releaseName: shop-globex-infra
      valuesObject:
        events:
          account: shop-globex
          maxAge: 24h
          replicas: 1
          storage: file
        installName: shop-globex
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shop-globex-pg-runtime
          runtimeRole: shop_globex_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/shop-globex-infra
    targetRevision: 1.4.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

