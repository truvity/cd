# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: cd-acme-shop
  namespace: cd-acme-shop
spec:
  promotionPolicies:
  - autoPromotionEnabled: true
    stage: dev-globex
  - autoPromotionEnabled: false
    stage: stage-globex
  - autoPromotionEnabled: false
    stage: dev-initech

---
# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev-globex
  namespace: cd-acme-shop
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/shop/globex/dev/pin.yaml
          updates:
          - key: pins.dev-globex
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(shop): promote ${{ chartFrom(vars.chartRepo).Version }}
            to dev for globex'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/shop-globex
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop-globex
    sources:
      direct: true

---
# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: stage-globex
  namespace: cd-acme-shop
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: dev-globex-shop
            namespace: cd-acme-shop
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/shop/globex/stage/pin.yaml
          updates:
          - key: pins.stage-globex
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(shop): promote ${{ chartFrom(vars.chartRepo).Version }}
            to stage for globex'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(shop): promote to stage for globex'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/shop-globex
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop-globex
    sources:
      stages:
      - dev-globex

