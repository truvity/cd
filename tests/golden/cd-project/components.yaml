# Source: cd-project/templates/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    example.com/component: keycloak
    example.com/customer: globex
  name: devel-shared-sso-globex-keycloak-infra
  namespace: cd-shared-sso
spec:
  destination:
    name: devel
    namespace: shared-sso-globex
  project: devel-shared-sso-globex-keycloak
  revisionHistoryLimit: 3
  sources:
  - helm:
      releaseName: shared-sso-globex-keycloak-infra
      valuesObject:
        events:
          account: shared-sso-globex-keycloak
          maxAge: 24h
          replicas: 1
          storage: file
        installName: shared-sso-globex-keycloak
        postgres:
          instances: 1
          runtimePassword:
            generate: true
          runtimePasswordSecret: shared-sso-globex-keycloak-pg-runtime
          runtimeRole: shared_sso_globex_keycloak_app
          storage: 2Gi
        tier: primary
    path: .
    repoURL: oci://registry.example.com/charts/keycloak-infra
    targetRevision: 1.4.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

