# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: stage-generic-keycloak
  namespace: shared-sso
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: devel-shared-sso-generic-keycloak-app
            namespace: cd-shared-sso
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/sso/generic/keycloak/stage/pin.yaml
          updates:
          - key: pins.stage-generic-keycloak
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(sso): promote keycloak ${{ chartFrom(vars.chartRepo).Version
            }} to stage for generic'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(sso): promote keycloak to stage for generic'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/keycloak
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: sso-keycloak
    sources:
      stages:
      - devel-generic-keycloak

