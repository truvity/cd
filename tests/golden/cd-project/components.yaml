apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shared-sso
  namespace: shared-sso
spec:
  promotionPolicies:
  - autoPromotionEnabled: true
    stage: devel-generic-keycloak
  - autoPromotionEnabled: true
    stage: devel-generic-portal
  - autoPromotionEnabled: true
    stage: devel-globex-keycloak
  - autoPromotionEnabled: true
    stage: devel-globex-portal
  - autoPromotionEnabled: true
    stage: devel-initech-keycloak
  - autoPromotionEnabled: true
    stage: devel-initech-portal
  - autoPromotionEnabled: true
    stage: devel-umbrella-keycloak
  - autoPromotionEnabled: true
    stage: devel-umbrella-portal
  - autoPromotionEnabled: true
    stage: devel-hooli-keycloak
  - autoPromotionEnabled: true
    stage: devel-hooli-portal
  - autoPromotionEnabled: true
    stage: devel-internal-demo
  - autoPromotionEnabled: true
    stage: devel-globex-master-keycloak

