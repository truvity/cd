apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: sso-demo
  namespace: shared-sso
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - chart:
      discoveryLimit: 20
      repoURL: oci://registry.example.com/charts/demo
      semverConstraint: '>=0.1.0 <1.0.0'

