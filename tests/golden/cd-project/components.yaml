    argocd.argoproj.io/sync-wave: "4"
  name: stage-generic-portal
  namespace: shared-sso
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: devel-shared-sso-generic-portal-app
            namespace: cd-shared-sso
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/sso/generic/portal/stage/pin.yaml
          updates:
          - key: pins.stage-generic-portal
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(sso): promote portal ${{ chartFrom(vars.chartRepo).Version
            }} to stage for generic'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(sso): promote portal to stage for generic'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/portal
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: sso-portal
    sources:
      stages:
      - devel-generic-portal

