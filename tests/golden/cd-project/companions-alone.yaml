# Source: cd-project/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: stage-globex
  namespace: cd-acme-shop
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/shop/globex/stage/pin.yaml
          updates:
          - key: pins.stage-globex-web
            value: ${{ imageFrom("registry.example.com/static/shop/web").Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(shop): promote ${{ imageFrom("registry.example.com/static/shop/web").Digest
            }} to stage for globex'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(shop): promote to stage for globex'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop-globex
    sources:
      direct: true

