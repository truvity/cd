metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: shop-globex
  namespace: cd-acme-shop
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - image:
      constraint: '>=1.0.0'
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      repoURL: registry.example.com/static/shop/web
      strictSemvers: false

