apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    acme.example.com/customer: globex
  name: dev-globex-shop-web-infra
  namespace: cd-acme-shop
spec:
  destination:
    name: dev
    namespace: shop-globex
  project: dev-globex-shop
  revisionHistoryLimit: 3
  sources:
  - helm:
      releaseName: shop-globex-web
      valuesObject:
        fullnameOverride: shop-globex-web
        installName: shop-globex-web
        serviceAccount:
          name: shop-globex-web
    path: .
    repoURL: oci://registry.example.com/charts/static-site-infra
    targetRevision: 3.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
      limit: -1
      refresh: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=false

