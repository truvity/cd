# Source: cd-webhook-relay/templates/relay.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cd-webhook-relay
  labels:
    app.kubernetes.io/name: webhook-relay
    app.kubernetes.io/instance: cd-webhook-relay
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: cd-webhook-relay-0.0.0
data:
  config.yaml: |
    listen: :8080
    maxBodyBytes: 1048576
    readTimeout: 10s
    senders:
    - name: acme
      owners:
      - acme
      - acme-labs
      secretFile: /etc/webhook-relay/secrets/acme-webhook/secret
    - name: globex
      owners:
      - globex
      secretFile: /etc/webhook-relay/secrets/shared-webhooks/globex
    - name: initech
      owners:
      - initech
      - some-user
      secretFile: /etc/webhook-relay/secrets/shared-webhooks/initech
    target:
      secretFile: /etc/webhook-relay/secrets/argocd-webhook/secret
      url: http://argocd-server.argocd.svc/api/webhook
    targetTimeout: 15s
    writeTimeout: 20s

