apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cd-webhook-relay
  labels:
    app.kubernetes.io/name: webhook-relay
    app.kubernetes.io/instance: cd-webhook-relay
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: cd-webhook-relay-0.0.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook-relay
      app.kubernetes.io/instance: cd-webhook-relay
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

