apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: site
  namespace: site
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - image:
      constraint: '>=1.0.0'
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      repoURL: registry.example.com/sites/web
      strictSemvers: true

