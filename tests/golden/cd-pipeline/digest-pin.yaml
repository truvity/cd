---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev
  namespace: site
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/dev.yaml
          updates:
          - key: versions.site
            value: ${{ imageFrom(vars.chartRepo).Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(versions): promote site ${{ imageFrom(vars.chartRepo).Tag
            }} to dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/environments.git
      - name: chartRepo
        value: registry.example.com/sites/web
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: site
    sources:
      direct: true

---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: prod
  namespace: site
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: dev-site
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/prod.yaml
          updates:
          - key: versions.site
            value: ${{ imageFrom(vars.chartRepo).Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore(versions): promote site ${{ imageFrom(vars.chartRepo).Tag
            }} to prod'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore(versions): promote site ${{ imageFrom(vars.chartRepo).Tag
            }} to prod'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/environments.git
      - name: chartRepo
        value: registry.example.com/sites/web
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: site
    sources:
      stages:
      - dev

