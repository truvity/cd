# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: stage-globex
  namespace: cd-acme-shop
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: dev-globex-shop-api
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
          - name: dev-globex-shop-web
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/shop/globex/stage/pin.yaml
          updates:
          - key: pins.stage-globex
            value: ${{ chartFrom(vars.chartRepo).Version }}
          - key: pins.stage-globex-web
            value: ${{ imageFrom("registry.example.com/static/shop/web").Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote shop ${{ chartFrom(vars.chartRepo).Version }} to
            stage'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore: promote shop to stage'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/shop/api-globex
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop-globex
    sources:
      stages:
      - dev-globex
  verification:
    analysisTemplates:
    - name: shop-stage-globex-promoted-version
    - name: shop-stage-globex-promoted-web
    args:
    - name: chart-version
      value: ${{ chartFrom("oci://registry.example.com/charts/shop/api-globex").Version
        }}
    - name: web-digest
      value: ${{ imageFrom("registry.example.com/static/shop/web").Digest }}

