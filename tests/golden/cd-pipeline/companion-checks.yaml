apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-globex-promoted-version
  namespace: cd-acme-shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: promoted-version
    provider:
      job:
        spec:
          activeDeadlineSeconds: 1620
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /ko-app/promotion-gate
                - promoted-version
                env:
                - name: APPS
                  value: dev-globex-shop-api dev-globex-shop-web
                - name: CHART_REPO
                  value: oci://registry.example.com/charts/shop/api-globex
                - name: CHART_NAME
                  value: ""
                - name: EXPECTED
                  value: '{{args.chart-version}}'
                - name: WAIT_SECONDS
                  value: "1500"
                - name: POLL_SECONDS
                  value: "15"
                image: ghcr.io/example/promotion-gate@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                name: check
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              restartPolicy: Never
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: kargo-verify-dev-globex
          ttlSecondsAfterFinished: 21600

