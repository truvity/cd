# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: cd-acme-shop
  namespace: cd-acme-shop
spec:
  promotionPolicies:
  - autoPromotionEnabled: true
    stage: dev-globex
  - autoPromotionEnabled: true
    stage: stage-globex
  - autoPromotionEnabled: true
    stage: dev-initech
  - autoPromotionEnabled: true
    stage: stage-initech

---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev-globex
  namespace: cd-acme-shop
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/projects/shop/globex/dev/pin.yaml
          updates:
          - key: pins.dev-globex-web
            value: ${{ imageFrom("preview.example.com/static/shop/web").Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote shop ${{ imageFrom("preview.example.com/static/shop/web").Digest
            }} to dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop-globex-preview
    sources:
      direct: true
  verification:
    analysisTemplates:
    - name: shop-dev-globex-promoted-web
    args:
    - name: web-digest
      value: ${{ imageFrom("preview.example.com/static/shop/web").Digest }}

