# Source: cd-pipeline/templates/objects.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-devel-promoted-version
  namespace: shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: promoted-version
    provider:
      job:
        spec:
          activeDeadlineSeconds: 1920
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /bin/sh
                - /scripts/verify-promoted-version.sh
                env:
                - name: APPS
                  value: shop
                - name: CHART_REPO
                  value: oci://registry.example.com/charts/shop
                - name: CHART_NAME
                  value: ""
                - name: EXPECTED
                  value: v{{args.chart-version}}
