apiVersion: v1
data:
  verify-e2e-operation.sh: "#!/bin/sh\n#\n# The end-to-end check of a Kargo Stage
    whose promotion ran the product's\n# end-to-end suite through the `argocd-update`
    step on the end-to-end\n# Application. The step wrote a sync operation on the
    Application and waited\n# for it; this check asks the Application what that operation
    did, so a Freight\n# is verified only when the suite ran for the version it promoted.\n#\n#
    It holds until (a) the Application's spec pins the promoted version (its\n# targetRevision
    is EXPECTED, so a stale parent render is waited out), (b) the\n# last operation
    has phase Succeeded, (c) that operation synced the revision the\n# spec currently
    resolves to (syncResult revisions equal status.sync revisions;\n# for an OCI chart
    both are digests, never the version string), and (d) the\n# suite's Job for EXPECTED
    succeeded: either a Sync-hook Job of the operation\n# with hookPhase Succeeded,
    or, while the Job is still a tracked resource (no\n# hook), a Job of that version
    Healthy in the Application's resources. The Job\n# is named `<project>-e2e-<version
    with dashes>`. A Failed or Errored\n# operation, or a Job that did not succeed,
    fails at once.\n#\n# Not checked: that the operation finished after the Promotion
    started. The\n# check does not know the Promotion; (a) and (c) tie the operation
    to the\n# promoted revision instead.\n#\n# Reads the Application with the pod's
    own ServiceAccount through the\n# in-cluster API (curl and jq); the Role the chart
    renders allows `get` on\n# exactly that Application.\n#\n# Env: APP (the end-to-end
    Application name), EXPECTED (the targetRevision,\n# prefix included), ARGOCD_NAMESPACE
    (default argocd), WAIT_SECONDS,\n# POLL_SECONDS, JQ.\nset -u\n\nJQ=\"${JQ:-jq}\"\nAPI=\"https://kubernetes.default.svc\"\nSA=/var/run/secrets/kubernetes.io/serviceaccount\nstarted=$(date
    +%s)\nlast=\"\"\n\n# One line: \"<verdict> <message>\". verdict: ok, wait, fail.
    Reads the\n# Application on stdin.\njudge() {\n\t\"$JQ\" -r --arg exp \"$EXPECTED\"
    '\n\t  def revs: ([.revision] + (.revisions // [])) | map(select(. != null and
    . != \"\"));\n\t  (.status.operationState // null) as $op\n\t  | ($exp | sub(\"^[^0-9]*\";
    \"\") | gsub(\"\\\\.\"; \"-\")) as $dashed\n\t  | ((.spec.sources // [.spec.source
    // {}]) | map(.targetRevision // \"\")) as $pins\n\t  | (($op.syncResult // {})
    | revs) as $synced\n\t  | ((.status.sync // {}) | revs) as $resolved\n\t  | [($op.syncResult.resources
    // [])[]\n\t      | select(.hookType == \"Sync\" and .kind == \"Job\" and (.name
    | endswith(\"-e2e-\" + $dashed)))] as $hooks\n\t  | [(.status.resources // [])[]\n\t
    \     | select(.kind == \"Job\" and (.name | endswith(\"-e2e-\" + $dashed)))]
    as $tracked\n\t  | if ($pins | index($exp)) == null then\n\t      \"wait the Application
    pins \\($pins | join(\",\") | if . == \"\" then \"no revision\" else . end), want
    \\($exp)\"\n\t    elif $op == null then \"wait the Application has no operation
    yet\"\n\t    elif ($op.phase == \"Failed\" or $op.phase == \"Error\") then\n\t
    \     \"fail the last operation \\($op.phase): \\($op.message // \"no message\")\"\n\t
    \   elif $op.phase != \"Succeeded\" then \"wait the last operation is \\($op.phase
    // \"unknown\")\"\n\t    elif ($synced | length) == 0 or (($synced | sort) !=
    ($resolved | sort)) then\n\t      \"wait the last operation synced \\($synced
    | join(\",\") | if . == \"\" then \"no revision\" else . end), the Application
    resolves \\($resolved | join(\",\") | if . == \"\" then \"no revision\" else .
    end)\"\n\t    elif ($hooks | length) > 0 then\n\t      if ($hooks | all(.hookPhase
    == \"Succeeded\")) then\n\t        \"ok operation Succeeded at \\($exp), hook
    Jobs: \\($hooks | map(.name) | join(\", \"))\"\n\t      elif ($hooks | any(.hookPhase
    == \"Failed\" or .hookPhase == \"Error\")) then\n\t        \"fail a hook Job did
    not succeed: \\($hooks | map(\"\\(.name)=\\(.hookPhase // \"unknown\")\") | join(\",
    \"))\"\n\t      else \"wait a hook Job is still running: \\($hooks | map(\"\\(.name)=\\(.hookPhase
    // \"unknown\")\") | join(\", \"))\" end\n\t    elif ($tracked | length) > 0 then\n\t
    \     if ($tracked | all(.health.status == \"Healthy\")) then\n\t        \"ok
    operation Succeeded at \\($exp), tracked Job: \\($tracked | map(.name) | join(\",
    \"))\"\n\t      elif ($tracked | any(.health.status == \"Degraded\")) then\n\t
    \       \"fail the tracked Job did not succeed: \\($tracked | map(\"\\(.name)=\\(.health.status
    // \"unknown\")\") | join(\", \"))\"\n\t      else \"wait the tracked Job is not
    complete: \\($tracked | map(\"\\(.name)=\\(.health.status // \"unknown\")\") |
    join(\", \"))\" end\n\t    else \"wait the Application has no e2e Job for \\($dashed)
    yet\" end'\n}\n\n# Test hook: judge the Application JSON on stdin and exit.\nif
    [ -n \"${JUDGE_ONLY:-}\" ]; then\n\tjudge\n\texit 0\nfi\n\nwhile :; do\n\tbody=$(curl
    -sS --max-time 20 --cacert \"$SA/ca.crt\" \\\n\t\t-H \"Authorization: Bearer $(cat
    \"$SA/token\")\" \\\n\t\t-w '\\n%{http_code}' \\\n\t\t\"$API/apis/argoproj.io/v1alpha1/namespaces/${ARGOCD_NAMESPACE:-argocd}/applications/$APP\"
    2>&1)\n\tcode=$(printf '%s' \"$body\" | tail -n 1)\n\tbody=$(printf '%s' \"$body\"
    | sed '$d')\n\tif [ \"$code\" != \"200\" ]; then\n\t\tline=\"wait cannot read
    Application (HTTP $code)\"\n\telse\n\t\tline=$(printf '%s' \"$body\" | judge)\n\tfi\n\tverdict=${line%%
    *}\n\tmsg=${line#* }\n\n\tcase \"$verdict\" in\n\tok)\n\t\techo \"$APP: $msg\"\n\t\texit
    0\n\t\t;;\n\tfail)\n\t\techo \"FAIL: $APP: $msg\"\n\t\texit 1\n\t\t;;\n\tesac\n\n\tnow=$(date
    +%s)\n\tif [ $((now - started)) -ge \"$WAIT_SECONDS\" ]; then\n\t\techo \"FAIL:
    after ${WAIT_SECONDS}s the end-to-end run for $EXPECTED is not done: $msg\"\n\t\texit
    1\n\tfi\n\tif [ \"$msg\" != \"$last\" ]; then\n\t\techo \"waiting ($((now - started))s
    of ${WAIT_SECONDS}s): $APP: $msg\"\n\t\tlast=$msg\n\tfi\n\tsleep \"$POLL_SECONDS\"\ndone\n"
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-devel-verify-e2e-operation
  namespace: shop

