# Source: cd-pipeline/templates/objects.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-metrics-gate
  namespace: shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: metrics-gate
    provider:
      job:
        spec:
          activeDeadlineSeconds: 2100
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /ko-app/promotion-gate
                - metrics-gate
                env:
                - name: CHART_VERSION
                  value: '{{args.chart-version}}'
                - name: PROJECT_NAME
                  value: shop
                - name: WORKLOAD_NAMESPACE
                  value: shop
                - name: WORKLOAD_RELEASE
                  value: shop
                - name: ISSUER_HOST
                  value: issuer.example.com
                - name: METRICS_BASE_URL
                  value: https://metrics.example.com/prometheus
                - name: SA_TOKEN_FILE
                  value: /var/run/secrets/issuer/token
                - name: PHASE1_SECONDS
                  value: "900"
                - name: BAKE_SECONDS
                  value: "900"
                - name: SCRAPE_LAG_SECONDS
                  value: "30"
                - name: POLL_SECONDS
                  value: "15"
                - name: MIN_JOURNEYS
                  value: "20"
                - name: MAX_FAILURE_RATIO
                  value: "0.05"
                - name: CHECK_FIRING_ALERTS
                  value: "true"
                - name: PROBER_JOURNEY_METRIC
                  value: probe_journey_total
                - name: E2E_JOB_REQUIRED
                  value: "false"
                image: ghcr.io/truvity/cd/promotion-gate:0.18.0
                name: check
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /var/run/secrets/issuer
                  name: issuer-token
                  readOnly: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: shop-metrics-gate
              volumes:
              - name: issuer-token
                projected:
                  sources:
                  - serviceAccountToken:
                      audience: issuer
                      expirationSeconds: 3600
                      path: token
          ttlSecondsAfterFinished: 21600

