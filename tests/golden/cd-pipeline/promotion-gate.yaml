---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev
  namespace: shop
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/dev.yaml
          updates:
          - key: shop
            value: ${{ chartFrom(vars.chartRepo).Version }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote shop ${{ chartFrom(vars.chartRepo).Version }} to
            dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/environments.git
      - name: chartRepo
        value: oci://registry.example.com/charts/shop
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: shop
    sources:
      direct: true
  verification:
    analysisTemplates:
    - name: shop-dev-promoted-version
    - name: shop-dev-metrics-gate
    args:
    - name: chart-version
      value: ${{ chartFrom("oci://registry.example.com/charts/shop").Version }}


