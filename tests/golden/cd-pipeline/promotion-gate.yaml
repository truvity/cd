apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-promoted-version
  namespace: shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: promoted-version
    provider:
      job:
        spec:
          activeDeadlineSeconds: 1320
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /ko-app/promotion-gate
                - promoted-version
                env:
                - name: APPS
                  value: shop
                - name: CHART_REPO
                  value: oci://registry.example.com/charts/shop
                - name: CHART_NAME
                  value: ""
                - name: EXPECTED
                  value: '{{args.chart-version}}'
                - name: WAIT_SECONDS
                  value: "1200"
                - name: POLL_SECONDS
                  value: "20"
                - name: ARGOCD_NAMESPACE
                  value: cd-system
                image: ghcr.io/truvity/cd/promotion-gate:0.18.0
                name: check
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              restartPolicy: Never
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: kargo-verify-dev
          ttlSecondsAfterFinished: 21600

