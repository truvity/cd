    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/stage.yaml
          updates:
          - key: shop
