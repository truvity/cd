# Source: cd-pipeline/templates/objects.yaml
apiVersion: v1
data:
  verify-promoted-version.sh: "#!/bin/sh\n#\n# The promoted-version check of a Kargo
    Stage: the question a Promotion cannot\n# ask for itself. Kargo's argocd-wait
    step compares an Application's STATE and\n# has no revision field, and a Stage's
    own health never consults Argo CD, so\n# after the pin is pushed nothing asks
    whether the target Application renders\n# the promoted chart at all. A parent
    Application that is still mid-sync leaves\n# the child on the previous version,
    Synced and Healthy.\n#\n# Run as a Kargo verification, i.e. after the Promotion
    succeeded and before the\n# Freight counts as verified in this Stage, it holds
    until every target\n# Application (a) has the promoted chart version in its spec,
    (b) has been\n# COMPARED at that version (status.sync.comparedTo), and (c) is
    Synced, Healthy\n# and not mid-operation.\n#\n# Reads the Applications with the
    pod's own ServiceAccount through the\n# in-cluster API (curl and jq); the Role
    the chart renders allows `get` on\n# exactly the Applications the Stage names.\n#\n#
    Env: APPS (space separated Application names), CHART_REPO, CHART_NAME\n# (empty
    for OCI repos), EXPECTED (the targetRevision, prefix included),\n# ARGOCD_NAMESPACE
    (default argocd), WAIT_SECONDS, POLL_SECONDS, JQ.\nset -u\n\nJQ=\"${JQ:-jq}\"\nAPI=\"https://kubernetes.default.svc\"\nSA=/var/run/secrets/kubernetes.io/serviceaccount\nstarted=$(date
    +%s)\nlast=\"\"\n\n# One line per Application: \"<verdict> <message>\".\n# verdict:
    skip (renders none of this chart), ok, wait.\njudge() {\n\t\"$JQ\" -r --arg repo
    \"$CHART_REPO\" --arg chart \"$CHART_NAME\" --arg exp \"$EXPECTED\" '\n\t  # Identity
    of a chart source: repo without scheme or trailing slash,\n\t  # plus /chart where
    the source names one. Infra Applications say\n\t  # repoURL registry/charts +
    chart X, others the whole\n\t  # oci://.../X path, and Kargo the latter for both.\n\t
    \ def ident($r; $c): ($r | sub(\"^oci://\"; \"\") | sub(\"/+$\"; \"\")) + (if
    ($c // \"\") != \"\" then \"/\" + $c else \"\" end);\n\t  def mine: map(select(.
    != null and ident(.repoURL; .chart) == ident($repo; $chart)));\n\t  def revs:
    map(.targetRevision // \"\");\n\t  ((.spec.sources // [.spec.source]) | mine)
    as $spec\n\t  | ((.status.sync.comparedTo.sources // [.status.sync.comparedTo.source])
    | mine) as $cmp\n\t  | if ($spec | length) == 0 then \"skip renders no source
    from \\($repo)\"\n\t    elif ($spec | revs | all(. == $exp) | not) then\n\t      \"wait
    spec still targets \\($spec | revs | join(\",\")), want \\($exp) (parent app-of-apps
    not synced?)\"\n\t    elif (($cmp | length) == 0) or ($cmp | revs | all(. == $exp)
    | not) then\n\t      \"wait spec is at \\($exp) but last comparison was at \\($cmp
    | revs | join(\",\") | if . == \"\" then \"nothing\" else . end)\"\n\t    elif
    (.status.operationState.phase // \"\") == \"Running\" then \"wait a sync operation
    is still Running\"\n\t    elif (.status.sync.status // \"\") != \"Synced\" then
    \"wait sync status \\(.status.sync.status // \"unknown\")\"\n\t    elif (.status.health.status
    // \"\") != \"Healthy\" then \"wait health \\(.status.health.status // \"unknown\")\"\n\t
    \   else \"ok at \\($exp)\" end'\n}\n\nwhile :; do\n\tpending=\"\"\n\tmatched=0\n\treport=\"\"\n\tfor
    app in $APPS; do\n\t\tbody=$(curl -sS --max-time 20 --cacert \"$SA/ca.crt\" \\\n\t\t\t-H
    \"Authorization: Bearer $(cat \"$SA/token\")\" \\\n\t\t\t-w '\\n%{http_code}'
    \\\n\t\t\t\"$API/apis/argoproj.io/v1alpha1/namespaces/${ARGOCD_NAMESPACE:-argocd}/applications/$app\"
    2>&1)\n\t\tcode=$(printf '%s' \"$body\" | tail -n 1)\n\t\tbody=$(printf '%s' \"$body\"
    | sed '$d')\n\t\tif [ \"$code\" != \"200\" ]; then\n\t\t\tline=\"wait cannot read
    Application (HTTP $code)\"\n\t\telse\n\t\t\tline=$(printf '%s' \"$body\" | judge)\n\t\tfi\n\t\tverdict=${line%%
    *}\n\t\tmsg=${line#* }\n\t\treport=\"$report\n  $app: $msg\"\n\t\tcase \"$verdict\"
    in\n\t\tskip) ;;\n\t\tok) matched=$((matched + 1)) ;;\n\t\t*) matched=$((matched
    + 1)); pending=\"$pending $app\" ;;\n\t\tesac\n\tdone\n\n\tif [ -z \"$pending\"
    ] && [ \"$matched\" -gt 0 ]; then\n\t\techo \"promoted version $EXPECTED is rendered
    and Synced/Healthy:$report\"\n\t\texit 0\n\tfi\n\n\tif [ \"$matched\" -eq 0 ];
    then\n\t\techo \"FAIL: none of the Applications ($APPS) renders a source from
    $CHART_REPO -- check the Stage's applications:$report\"\n\t\texit 1\n\tfi\n\n\tnow=$(date
    +%s)\n\tif [ $((now - started)) -ge \"$WAIT_SECONDS\" ]; then\n\t\techo \"FAIL:
    after ${WAIT_SECONDS}s the promoted version $EXPECTED is not live. Not ready:$report\"\n\t\techo
    \"If an Application still targets the previous version, the parent that renders
    its pin has not synced: look for a sync operation still Running on it.\"\n\t\texit
    1\n\tfi\n\n\tif [ \"$report\" != \"$last\" ]; then\n\t\techo \"waiting ($((now
    - started))s of ${WAIT_SECONDS}s):$report\"\n\t\tlast=$report\n\tfi\n\tsleep \"$POLL_SECONDS\"\ndone\n"
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-verify-promoted-version
  namespace: shop

