        value: https://git.example.com/acme/environments.git
      - name: chartRepo
        value: https://charts.example.com/
      - name: chartName
        value: gateway
  requestedFreight:
  - origin:
      kind: Warehouse
      name: platform-gateway
    sources:
      stages:
      - dev
  verification:
    analysisTemplates:
    - name: gateway-prod-promoted-version
    args:
    - name: chart-version
      value: ${{ chartFrom("https://charts.example.com/", "gateway").Version }}


