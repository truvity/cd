apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-promoted-version
  namespace: shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: promoted-version
    provider:
      job:
        spec:
          activeDeadlineSeconds: 1620
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /bin/sh
                - /scripts/verify-promoted-version.sh
                env:
                - name: APPS
                  value: dev-shop
                - name: CHART_REPO
                  value: oci://registry.example.com/charts/shop
                - name: CHART_NAME
                  value: ""
                - name: EXPECTED
                  value: '{{args.chart-version}}'
                - name: WAIT_SECONDS
                  value: "1500"
                - name: POLL_SECONDS
                  value: "15"
                - name: JQ
                  value: /opt/jq/jq
                image: registry.example.com/tools/curl:8
                name: check
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /opt/jq
                  name: jq-tool
                  readOnly: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: kargo-verify-dev
              volumes:
              - configMap:
                  defaultMode: 365
                  name: shop-dev-verify-promoted-version
                name: script
              - image:
                  pullPolicy: IfNotPresent
                  reference: registry.example.com/tools/jq:1
                name: jq-tool
          ttlSecondsAfterFinished: 21600

