    + 1)); pending=\"$pending $app\" ;;\n\t\tesac\n\tdone\n\n\tif [ -z \"$pending\"
    ] && [ \"$matched\" -gt 0 ]; then\n\t\techo \"promoted version $EXPECTED is rendered
    and Synced/Healthy:$report\"\n\t\texit 0\n\tfi\n\n\tif [ \"$matched\" -eq 0 ];
    then\n\t\techo \"FAIL: none of the Applications ($APPS) renders a source from
    $CHART_REPO -- check the Stage's applications:$report\"\n\t\texit 1\n\tfi\n\n\tnow=$(date
    +%s)\n\tif [ $((now - started)) -ge \"$WAIT_SECONDS\" ]; then\n\t\techo \"FAIL:
    after ${WAIT_SECONDS}s the promoted version $EXPECTED is not live. Not ready:$report\"\n\t\techo
    \"If an Application still targets the previous version, the parent that renders
    its pin has not synced: look for a sync operation still Running on it.\"\n\t\texit
    1\n\tfi\n\n\tif [ \"$report\" != \"$last\" ]; then\n\t\techo \"waiting ($((now
    - started))s of ${WAIT_SECONDS}s):$report\"\n\t\tlast=$report\n\tfi\n\tsleep \"$POLL_SECONDS\"\ndone\n"
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-stage-verify-promoted-version
  namespace: shop

