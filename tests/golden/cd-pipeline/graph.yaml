apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: shop-dev-metrics-gate
  namespace: shop
spec:
  args:
  - name: chart-version
  metrics:
  - count: 1
    failureLimit: 0
    name: metrics-gate
    provider:
      job:
        spec:
          activeDeadlineSeconds: 2220
          backoffLimit: 0
          template:
            spec:
              containers:
              - command:
                - /bin/sh
                - /scripts/verify-metrics-gate.sh
                env:
                - name: CHART_VERSION
                  value: '{{args.chart-version}}'
                - name: PROJECT_NAME
                  value: shop
                - name: ISSUER_HOST
                  value: issuer.example.com
                - name: METRICS_BASE_URL
                  value: https://metrics.dev.example.com/prometheus
                - name: SA_TOKEN_FILE
                  value: /var/run/secrets/tokens/issuer/token
                - name: CA_BUNDLE
                  value: /etc/ssl/metrics-ca/ca-certificates.crt
                - name: WORKLOAD_NAMESPACE
                  value: shop
                - name: WORKLOAD_RELEASE
                  value: shop
                - name: PHASE1_SECONDS
                  value: "1500"
                - name: BAKE_SECONDS
                  value: "600"
                - name: SCRAPE_LAG_SECONDS
                  value: "30"
                - name: POLL_SECONDS
                  value: "30"
                - name: MIN_JOURNEYS
                  value: "10"
                - name: MAX_FAILURE_RATIO
                  value: "0.05"
                - name: CHECK_FIRING_ALERTS
                  value: "true"
                - name: PROBER_JOURNEY_METRIC
                  value: probe_journey_total
                - name: E2E_JOB_REQUIRED
                  value: "false"
                - name: JQ
                  value: /opt/jq/jq
                image: registry.example.com/tools/curl:8
                name: check
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /scripts
                  name: script
                  readOnly: true
                - mountPath: /var/run/secrets/tokens/issuer
                  name: issuer-token
                  readOnly: true
                - mountPath: /etc/ssl/metrics-ca
                  name: ca-bundle
                  readOnly: true
                - mountPath: /opt/jq
                  name: jq-tool
                  readOnly: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: gate-dev
              volumes:
              - configMap:
                  defaultMode: 365
                  name: shop-dev-verify-metrics-gate
                name: script
              - name: issuer-token
                projected:
                  sources:
                  - serviceAccountToken:
                      audience: issuer
                      expirationSeconds: 3600
                      path: token
              - configMap:
                  name: private-root
                name: ca-bundle
              - image:
                  pullPolicy: IfNotPresent
                  reference: registry.example.com/tools/jq:1
                name: jq-tool
          ttlSecondsAfterFinished: 21600

