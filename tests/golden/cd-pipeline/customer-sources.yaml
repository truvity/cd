---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: shop-globex
  namespace: cd-acme-shop
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - chart:
      discoveryLimit: 20
      repoURL: oci://registry.example.com/charts/shop/api-globex
      semverConstraint: '>=1.0.0 <2.0.0'
  - image:
      constraint: '>=1.0.0'
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      repoURL: registry.example.com/static/shop/web
      strictSemvers: false

