---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev
  namespace: platform-hubble
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/dev.yaml
          updates:
          - key: hubble
            value: ${{ imageFrom(vars.chartRepo).Tag }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote hubble ${{ imageFrom(vars.chartRepo).Tag }} to
            dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/environments.git
      - name: chartRepo
        value: registry.example.com/vendor/charts/hubble
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: platform-hubble
    sources:
      direct: true

