apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: platform-hubble
  namespace: platform-hubble
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - image:
      constraint: '>=1.2.9 <2.0.0'
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      repoURL: registry.example.com/vendor/charts/hubble
      strictSemvers: false

