apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: kargo-git-writeback
  namespace: shop
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: pipeline/acme-app
      metadataPolicy: None
      nullBytePolicy: Ignore
      property: app-id
    secretKey: githubAppID
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: pipeline/acme-app
      metadataPolicy: None
      nullBytePolicy: Ignore
      property: installation-id
    secretKey: githubInstallationID
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: pipeline/acme-app
      metadataPolicy: None
      nullBytePolicy: Ignore
      property: private-key
    secretKey: githubPrivateKey
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    creationPolicy: Owner
    name: kargo-git-writeback
    template:
      data:
        githubAppID: '{{ .githubAppID }}'
        githubAppInstallationID: '{{ .githubInstallationID }}'
        githubAppPrivateKey: '{{ .githubPrivateKey }}'
        repoURL: https://git.example.com/acme/environments.git
      metadata:
        labels:
          kargo.akuity.io/cred-type: git

