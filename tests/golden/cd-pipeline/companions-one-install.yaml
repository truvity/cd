apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: docs
  namespace: docs
spec:
  promotionPolicies:
  - autoPromotionEnabled: true
    stage: dev

---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev
  namespace: docs
spec:
  promotionTemplate:
    spec:
      steps:
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/dev.yaml
          updates:
          - key: versions.dev.docs
            value: ${{ chartFrom(vars.chartRepo).Version }}
          - key: sites.dev.docs
            value: ${{ imageFrom("registry.example.com/static/docs/site").Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote docs ${{ chartFrom(vars.chartRepo).Version }} to
            dev'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - config:
          path: ./repo
          targetBranch: main
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/docs
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: docs
    sources:
      direct: true

---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: stage
  namespace: docs
spec:
  promotionTemplate:
    spec:
      steps:
      - as: gate
        config:
          apps:
          - name: dev-docs
            namespace: argocd
            waitFor:
            - health
            - sync
            - operation
        retry:
          timeout: 10m0s
        uses: argocd-wait
      - config:
          checkout:
          - branch: main
            path: ./repo
          repoURL: ${{ vars.gitRepo }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-clone
      - config:
          path: ./repo/versions/stage.yaml
          updates:
          - key: versions.stage.docs
            value: ${{ chartFrom(vars.chartRepo).Version }}
          - key: sites.stage.docs
            value: ${{ imageFrom("registry.example.com/static/docs/site").Digest }}
        uses: yaml-update
      - as: commit
        config:
          message: 'chore: promote docs ${{ chartFrom(vars.chartRepo).Version }} to
            stage'
          path: ./repo
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-commit
      - as: push
        config:
          generateTargetBranch: true
          path: ./repo
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-push
      - as: open-pr
        config:
          provider: github
          repoURL: ${{ vars.gitRepo }}
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'chore: promote docs to stage'
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
          timeout: 5m0s
        uses: git-open-pr
      - config:
          prNumber: ${{ outputs['open-pr'].pr.id }}
          provider: github
          repoURL: ${{ vars.gitRepo }}
        if: ${{ status('commit') == 'Succeeded' }}
        retry:
          errorThreshold: 3
        uses: git-wait-for-pr
      vars:
      - name: gitRepo
        value: https://git.example.com/acme/gitops.git
      - name: chartRepo
        value: oci://registry.example.com/charts/docs
      - name: chartName
        value: ""
  requestedFreight:
  - origin:
      kind: Warehouse
      name: docs
    sources:
      stages:
      - dev


---
# Source: cd-pipeline/templates/objects.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: docs
  namespace: docs
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
  - chart:
      discoveryLimit: 20
      repoURL: oci://registry.example.com/charts/docs
      semverConstraint: '>=1.0.0'
  - image:
      constraint: '>=1.0.0'
      discoveryLimit: 20
      imageSelectionStrategy: SemVer
      repoURL: registry.example.com/static/docs/site
      strictSemvers: false
