# expect: sets companions and warehouse.subscriptions
# Verbatim subscriptions would leave the companions out of the Freight.
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: versions/{stage}.yaml
  pinKey: versions.{stage}.{pinKey}
graph:
  upstreams:
    stage:
    - dev
projects:
- name: docs
  pinKey: docs
  chart:
    repoURL: oci://registry.example.com/charts/docs
    semver: '>=1.0.0'
  companions:
    site:
      repoURL: oci://registry.example.com/static/docs/site
      semver: '>=1.0.0'
      subscribeAs: image
      pin: digest
      pinKey: sites.{stage}.{pinKey}
  stageOrder:
  - dev
  - stage
  warehouse:
    subscriptions:
    - chart:
        repoURL: oci://registry.example.com/charts/docs
        semverConstraint: '>=1.0.0'
