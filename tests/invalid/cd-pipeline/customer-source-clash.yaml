# expect: is also another customer's Warehouse of a source
# Customer globex's Warehouse of source preview, shop-globex-preview, is also customer globex-preview's.
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
graph:
  upstreams:
    stage: [dev]
    prod: [stage]
  applicationName: "{stage}-{customer}-{app}"
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop/api
      semver: ">=1.0.0 <2.0.0"
    sources:
      preview:
        repoURL: oci://preview.example.com/charts/shop/api
        semver: ">=1.0.0-0 <2.0.0"
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
        sources:
          preview:
            repoURL: oci://preview.example.com/static/shop/web
            semver: ">=1.0.0-0"
    customers:
      - name: globex
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-globex
          semver: ">=1.0.0 <2.0.0"
        sources:
          preview:
            repoURL: oci://preview.example.com/charts/shop/api-globex
            semver: ">=1.0.0-0 <2.0.0"
      - name: initech
      - name: globex-preview
    applications: [shop-api, shop-web]
    stageOrder: [dev, stage, prod]
    stageSources: {dev: preview}
    upstreams: {stage: []}
