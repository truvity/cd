# expect: but its upstream "dev" takes "preview"
# stage would promote Freight of dev's source, which its Warehouse never sees.
git:
  repoURL: https://git.example.com/acme/environments.git
projects:
  - name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop
      semver: ">=1.0.0 <2.0.0"
    sources:
      preview:
        repoURL: oci://preview.example.com/charts/shop
        semver: ">=1.0.0-0 <2.0.0"
    stageOrder: [dev, stage]
    upstreams:
      stage: [dev]
    stageSources:
      dev: preview
