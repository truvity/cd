# expect: needs a bucketSlug
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  waves:
    infra: 10
    app: 20
    e2e: 30
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
  e2e:
    mode: full
products:
  shop:
    pin: 1.0.0
    interface: 3
    hostname: shop.example.com
    e2e:
      enabled: true
      events: {stream: x}
