# expect: platform.applicationPrefix names {vendor} but platform.vendor is not set
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: "{vendor}-east-"
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  shop:
    pin: 1.0.0
    interface: 1
    hostname: shop.example.com
