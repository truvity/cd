# expect: properties 'hostname' required, if 'pathPrefix' exists
# A path prefix is a path below a hostname: without one there is nothing to share.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  ledger:
    pin: 2.0.0
    interface: 15
    pathPrefix: /ledger/
