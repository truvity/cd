# expect: values.docs.e2e: kind static-site takes values.infra and values.app only
# A site has two rings and no end-to-end ring; the refusal does not wait for a pin.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 3.12.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    e2e:
      replicas: 1
