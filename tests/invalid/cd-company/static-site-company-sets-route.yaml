# expect: values.docs.app.route is platform-owned
# Where a static site is served is the platform's; a company cannot steer the route.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 3.12.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    app:
      route: {host: docs.example.com}
