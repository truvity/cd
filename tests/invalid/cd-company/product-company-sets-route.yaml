# expect: values.example-service.app.route.parentRef is platform-owned
# A company sets where its route is served (hostname, paths) but not the listener the route attaches to: the parent stays the platform's.
services: [example-service]
pins: {example-service: ""}
products:
  example-service: {kind: product, interface: 15, hostname: example-service.example.com}
values:
  example-service:
    app:
      route: {parentRef: {group: gateway.networking.k8s.io, kind: ListenerSet, name: other, namespace: elsewhere}}
