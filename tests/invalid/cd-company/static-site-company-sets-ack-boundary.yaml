# expect: values.docs.infra.registry.ack.permissionsBoundary is platform-owned
# The boundary of a site's role is the platform's: it bounds what a company's statement can grant.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 4.17.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    infra:
      registry: {ack: {permissionsBoundary: none}}
