# expect: values.example-service.app.archive is platform-owned
# A product's archive wiring is the platform's; a company cannot set it.
services: [example-service]
pins: {example-service: ""}
products:
  example-service: {kind: product, interface: 15, hostname: example-service.example.com}
values:
  example-service:
    app:
      archive: {enabled: true}
