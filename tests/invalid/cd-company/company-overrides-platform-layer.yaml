# expect: values.example-service.app.tuning.replicas is platform-owned
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres: {instances: 1, storage: 2Gi}
  events:
    url: nats://broker.example.com:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  example-service:
    interface: 15
    hostname: example-service.example.com
    layers:
      - name: tuning
        since: 1.0.0
        values:
          app:
            tuning: {replicas: 3}
services: [example-service]
pins: {example-service: "1.2.3"}
values:
  example-service:
    app:
      tuning: {replicas: 5}
