# expect: values.docs.app.registry is platform-owned
# The registry block is the platform's on the site ring as on the infrastructure ring.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 3.12.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    app:
      registry: {auth: none}
