# expect: values.example-service.app.otel is platform-owned
# A product's telemetry wiring is the platform's; a company cannot set it.
services: [example-service]
pins: {example-service: ""}
products:
  example-service: {kind: product, interface: 15, hostname: example-service.example.com}
values:
  example-service:
    app:
      otel: {enabled: true}
