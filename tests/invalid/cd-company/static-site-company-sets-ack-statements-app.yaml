# expect: values.docs.app.registry is platform-owned
# On the application ring the registry block has no statements: it stays reserved whole.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 4.17.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    app:
      registry: {ack: {extraStatements: []}}
