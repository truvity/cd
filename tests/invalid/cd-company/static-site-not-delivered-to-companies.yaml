# expect: kind static-site is not delivered through cd-company
# A static site's infrastructure ring carries an IAM role's scope. Until the
# adapter reserves the kind's paths against a company's values, the kind is
# refused here, dormant or not, instead of rendering with an open ring.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 3.12.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
