# expect: values.docs.infra.registry.ack.rolePrefix is platform-owned
# Which role the site runs as is the platform's.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 4.17.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    infra:
      registry: {ack: {rolePrefix: another-role}}
