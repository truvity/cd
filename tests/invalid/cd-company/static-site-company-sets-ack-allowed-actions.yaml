# expect: values.docs.infra.registry.ack.allowedExtraActions is platform-owned
# Which actions a company's statements may name is the platform's: a company cannot widen its own list.
platform:
  clusterName: devel
  argocdNamespace: argocd
  applicationPrefix: devel-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
products:
  docs:
    kind: static-site
    chartVersion: 4.17.0
    artifact: {ref: registry.example.com/sites/docs}
services: [docs]
pins: {docs: ""}
values:
  docs:
    infra:
      registry: {ack: {allowedExtraActions: ["s3:GetObject"]}}
