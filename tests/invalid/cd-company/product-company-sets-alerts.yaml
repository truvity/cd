# expect: values.example-service.app.alerts is platform-owned
# The alerts a product ships are the platform's; a company cannot switch them.
services: [example-service]
pins: {example-service: ""}
products:
  example-service: {kind: product, interface: 15, hostname: example-service.example.com}
values:
  example-service:
    app:
      alerts: {enabled: true}
