# expect: values.example-service.app.access is platform-owned
# The access block of a product is the platform's; a company cannot set it.
services: [example-service]
pins: {example-service: ""}
products:
  example-service: {kind: product, interface: 15, hostname: example-service.example.com}
values:
  example-service:
    app:
      access: {public: true}
