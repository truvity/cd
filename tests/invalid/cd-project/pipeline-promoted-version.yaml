# expect: additional properties 'promotedVersion' not allowed
# Pipeline input that would render the promoted-version check's objects
# (AnalysisTemplate, ConfigMap, ServiceAccount, Role, RoleBinding) here: the
# check's own settings are not the platform's to pass a company's render. The
# graph may turn the check on (case cd-project/verification); its objects are
# rendered where the check runs, never here.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: '>=1.0.0 <2.0.0'
  clusters:
    - dev
  pipeline:
    stageOrder:
      - dev
pins:
  dev: 1.2.3
values:
  dev:
    app:
      config:
        greeting: hello
clusters:
  - dev
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
pipeline:
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: pins/{stage}.yaml
  graph:
    promotedVersion: true
  promotedVersion:
    objects: true
    image: registry.example.com/tools/curl:8
    jqImage: registry.example.com/tools/jq:1
platformDigest: 420d3331e6813ef54a51c30510991121334a0b6fef66d108ff47ed51b9b1ffa8
