# expect: pipeline.project.metricsGateStages: "prod" is not a Stage of project.pipeline.stageOrder
# The platform gates a Stage the project does not have.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: '>=1.0.0 <2.0.0'
  clusters:
  - dev
  - stage
  pipeline:
    stageOrder:
    - dev
    - stage
pins:
  dev: 1.2.3
  stage: 1.2.0
values:
  dev:
    app:
      config:
        greeting: hello
clusters:
- dev
- stage
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
  stage:
    clusterName: stage
    argocdNamespace: argocd
    applicationPrefix: stage-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
  stage:
    interface: 15
    hostname: shop.stage.example.com
pipeline:
  project:
    metricsGateStages:
    - prod
  graph:
    upstreams:
      stage:
      - dev
    promotedVersion: true
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: pins/{stage}.yaml
platformDigest: 2b7f17dbf55ff0d61fb028b1833beca49e67a8e07ad9b0f83a76b57517655b6d
