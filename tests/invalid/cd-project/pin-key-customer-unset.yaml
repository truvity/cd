# expect: promotion.pinKey names {customer} but the project has no customer
# The pin key is named with {customer}, and the platform gives no customer.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: '>=1.0.0 <2.0.0'
  clusters:
    - dev
  pipeline:
    stageOrder:
      - dev
pins:
  dev: 1.2.3
values:
  dev:
    app:
      config:
        greeting: hello
clusters:
  - dev
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
pipeline:
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: pins/{stage}.yaml
    pinKey: pins.{customer}.{stage}
platformDigest: "0b4740a1e08ab252e6fa46078f0602d18c800fb67ae41772afcaa058ff0761a7"
