# expect: products.dev is kind chart, which has no infra ring
# A single chart (kind chart) has no infra ring to install an infra chart in.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: '>=1.0.0 <2.0.0'
    infraChart: oci://registry.example.com/charts/shop-infra
  clusters:
    - dev
  pipeline:
    stageOrder:
      - dev
pins:
  dev: 1.2.3
values:
  dev:
    app:
      config:
        greeting: hello
clusters:
  - dev
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev:
    kind: chart
pipeline:
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: pins/{stage}.yaml
platformDigest: 3131924b37bc56db90b7f52dd69ecfcf5382eed5b4f0b416b2988aa9cb1994b1
