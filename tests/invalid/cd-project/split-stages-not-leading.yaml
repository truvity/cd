# expect: pipeline.project.stages ["stage"] is not the leading part
# The platform names a Stage that is not at the head of stageOrder.
project:
  name: shop
  source:
    chart: oci://charts.example.com/acme/shop
    infraChart: oci://charts.example.com/acme/shop-infra
    semver: '>=1.0.0 <2.0.0'
  sources:
    preview:
      chart: oci://preview.example.com/acme/shop
      semver: '>=1.0.0-0 <2.0.0'
  clusters:
  - dev
  - stage
  - prod
  pipeline:
    stageOrder:
    - dev
    - stage
    - prod
    stageSources:
      dev: preview
    upstreams:
      stage: []
    autoPromote:
    - stage
pins:
  dev: 1.5.0-main.7
values:
  dev:
    infra:
      postgres:
        parameters:
          max_connections: '100'
    app:
      config:
        greeting: hello
        logLevel: debug
    e2e:
      config:
        timeout: 30s
clusters:
- dev
platform:
  dev:
    clusterName: dev
    argocdNamespace: delivery
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    applicationLabels:
      acme.example.com/project: '{product}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.dev.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
    cloud:
      accountID: EXAMPLE_ACCOUNT
      region: example-region
      iamNameTemplate: '{cluster}-{product}'
      bucketNameTemplate: '{cluster}-{slug}'
    e2e:
      mode: full
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
    bucketSlug: shop
    e2e:
      enabled: true
      events:
        url: nats://broker.dev.example.com:4222
pipeline:
  labels:
    acme.example.com/managed-by: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  argocd:
    namespace: delivery
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    branch: main
    pinFile: pins/{stage}.yaml
    commitMessage: 'chore({project}): promote {version} to {stage}'
    prTitle: 'chore({project}): promote to {stage}'
    prLabels:
    - promotion
  graph:
    upstreams:
      stage:
      - dev
      prod:
      - stage
  project:
    name: shop-next
    stages:
    - stage
platformDigest: ff8e2ca83dfe227ddc75927c08be1d50c4ed1d602b7ba986944cf367dd51f844
