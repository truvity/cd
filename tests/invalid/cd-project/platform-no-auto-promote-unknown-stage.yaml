# expect: pipeline.project.noAutoPromote: "prod" is not a Stage
# The platform holds back a Stage the project does not have.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: '>=1.0.0 <2.0.0'
  clusters:
    - dev
  pipeline:
    stageOrder:
      - dev
pins:
  dev: 1.2.3
values:
  dev:
    app:
      config:
        greeting: hello
clusters:
  - dev
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: dev-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
pipeline:
  project:
    noAutoPromote:
      - prod
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: pins/{stage}.yaml
platformDigest: "5f3a79c43b4d91564de57fc1da34345a5bf094c481918656a0d0a60605c32953"
