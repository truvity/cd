# expect: pipeline.project.handedOver names every cluster
# Handing over every cluster leaves this release nothing to render.
project:
  name: shop
  source:
    chart: oci://charts.example.com/acme/shop
    infraChart: oci://charts.example.com/acme/shop-infra
    semver: '>=1.0.0 <2.0.0'
  sources:
    preview:
      chart: oci://preview.example.com/acme/shop
      semver: '>=1.0.0-0 <2.0.0'
  clusters:
  - dev
  - stage
  - prod
  pipeline:
    stageOrder:
    - dev
    - stage
    - prod
    stageSources:
      dev: preview
    upstreams:
      stage: []
    autoPromote:
    - stage
pins:
  stage: 1.3.2
  prod: ''
values:
  stage:
    app:
      config:
        greeting: hello
  prod:
    app:
      config:
        greeting: hello
clusters:
- stage
- prod
platform:
  stage:
    clusterName: stage
    argocdNamespace: delivery
    applicationPrefix: stage-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    availability: high
    postgres:
      instances: 2
      storage: 4Gi
    events:
      url: nats://broker.stage.example.com:4222
      storage: file
      replicas: 2
      maxAge: 24h
      account: '{product}'
  prod:
    clusterName: prod
    argocdNamespace: delivery
    applicationPrefix: prod-
    appProject: '{product}-{cluster}'
    chartRegistry: oci://registry.example.com/charts
    availability: high
    postgres:
      instances: 3
      storage: 8Gi
    events:
      url: nats://broker.prod.example.com:4222
      storage: file
      replicas: 3
      maxAge: 72h
      account: '{product}'
products:
  stage:
    interface: 15
    hostname: shop.stage.example.com
  prod:
    interface: 15
    hostname: shop.example.com
pipeline:
  labels:
    acme.example.com/managed-by: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  argocd:
    namespace: delivery
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    branch: main
    pinFile: pins/{stage}.yaml
    commitMessage: 'chore({project}): promote {version} to {stage}'
    prTitle: 'chore({project}): promote to {stage}'
    prLabels:
    - promotion
  graph:
    upstreams:
      stage:
      - dev
      prod:
      - stage
  project:
    handedOver:
    - dev
    - stage
    - prod
platformDigest: 7c8601666a5b3defef6a942abc8c6e341fad77020a9d2e699001525fd129022b
