# The same installation as `everything`, with `global` nested under the subchart's
# key instead of at the root. Helm renders both the same; the case pins that.
argo-cd:
  server:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  controller:
    replicas: 1
    resources:
      requests:
        cpu: '1'
        memory: 3Gi
      limits:
        memory: 4Gi
  repoServer:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
  applicationSet:
    replicas: 0
  notifications:
    enabled: false
  configs:
    params:
      server.insecure: 'true'
      application.namespaces: cluster-*
      controller.sync.timeout.seconds: '1200'
    cm:
      admin.enabled: 'false'
      users.session.duration: 24h
      url: https://argocd.example.com
      oidc.config: "name: Example\nissuer: https://issuer.example.com\nclientID: $argocd-client:client-id\n\
        clientSecret: $argocd-client:client-secret\nrequestedScopes:\n  - openid\n\
        \  - profile\n  - email\n"
      resource.customizations.health.argoproj.io_Application: "hs = {}\nhs.status\
        \ = \"Progressing\"\nhs.message = \"\"\nif obj.status ~= nil and obj.status.health\
        \ ~= nil then\n  hs.status = obj.status.health.status\nend\nreturn hs\n"
    rbac:
      policy.csv: 'g, example:admin, role:admin

        g, example:viewer, role:readonly

        '
      policy.default: role:none
      scopes: '[groups]'
    repositories:
      example-charts:
        name: example-charts
        type: helm
        url: https://charts.example.com
  global:
    nodeSelector:
      kubernetes.io/arch: arm64
    tolerations:
    - key: arch
      value: arm64
      operator: Equal
      effect: NoSchedule
