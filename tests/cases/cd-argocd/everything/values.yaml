# A fully set installation, with neutral values (example.com, an issuer that
# does not exist). Mirrors the shape of a real one: HA, an OIDC sign-in,
# role bindings from the issuer's groups, health customizations, scheduling.
global:
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
    - key: arch
      value: arm64
      operator: Equal
      effect: NoSchedule
argo-cd:
  server:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  controller:
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: 3Gi
      limits:
        memory: 4Gi
  repoServer:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
  applicationSet:
    replicas: 0
  notifications:
    enabled: false
  configs:
    params:
      server.insecure: "true"
      application.namespaces: "cluster-*"
      controller.sync.timeout.seconds: "1200"
    cm:
      admin.enabled: "false"
      users.session.duration: "24h"
      url: https://argocd.example.com
      oidc.config: |
        name: Example
        issuer: https://issuer.example.com
        clientID: $argocd-client:client-id
        clientSecret: $argocd-client:client-secret
        requestedScopes:
          - openid
          - profile
          - email
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil and obj.status.health ~= nil then
          hs.status = obj.status.health.status
        end
        return hs
    rbac:
      policy.csv: |
        g, example:admin, role:admin
        g, example:viewer, role:readonly
      policy.default: role:none
      scopes: '[groups]'
    repositories:
      example-charts:
        name: example-charts
        type: helm
        url: https://charts.example.com
