# A static site whose pod has a second container that calls a cloud API: the
# company names what that container reads, in registry.ack.extraStatements of
# the infrastructure ring. The rest of the registry and identity block is the
# platform's (platformValues), and the two merge into one policy. The
# resources are placeholders: this chart passes them through, and a real ARN
# is a particular this repository does not publish.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  docs:
    kind: static-site
    chartVersion: 4.17.0
    artifact: {ref: registry.example.com/sites/docs}
    platformValues:
      infra:
        registry:
          auth: ecr
          ack:
            enabled: true
            clusterName: east
            repositoryArns: [registry-sites-docs]
            rolePrefix: east-docs.site
            tags: {project: docs}
            # What a company's statement may name.
            allowedExtraActions: ["appconfig:StartConfigurationSession", "appconfig:GetLatestConfiguration"]
      app:
        registry: {auth: ecr, ack: {enabled: true}}
services: [docs]
pins:
  docs: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
values:
  docs:
    infra:
      registry:
        ack:
          extraStatements:
            - Effect: Allow
              Action: ["appconfig:StartConfigurationSession", "appconfig:GetLatestConfiguration"]
              Resource: [flags-of-docs]
    app:
      live: {enabled: true, files: [flags.json]}
