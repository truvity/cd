# Preview lanes (arch SHP-12): one Kargo Project whose customers are lanes,
# one lane following its branch and one promoted by hand. dev-globex has no
# upstream and would promote on its own, and so would dev-initech; the
# company holds dev-initech back by its Stage's name
# (project.pipeline.noAutoPromote), and the platform holds stage-globex
# (pipeline.project.noAutoPromote). dev-globex still promotes on its own;
# nothing else of the render differs from the customers case.

# Company files.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    infraChart: oci://registry.example.com/charts/shop-infra
    semver: ">=1.0.0 <2.0.0"
  customers:
    - name: globex
      chart: oci://registry.example.com/charts/shop-globex
    - initech
  clusters: [dev, stage]
  pipeline:
    stageOrder: [dev, stage]
    noAutoPromote: [dev-initech]
pins:
  dev-globex: "1.4.0"
  stage-globex: "1.3.2"
  dev-initech: "1.4.1"
  stage-initech: ""
values:
  dev-globex:
    app:
      config:
        greeting: hello globex
  dev-initech:
    app:
      config:
        greeting: hello initech

# The platform's valuesObject.
clusters: [dev, stage]
platform:
  dev:
    clusterName: dev
    argocdNamespace: cd-acme-shop
    applicationPrefix: "dev-{customer}-"
    appProject: "{cluster}-{customer}-shop"
    vendor: acme
    applicationLabels:
      acme.example.com/customer: "{customer}"
    chartRegistry: oci://registry.example.com/charts
    postgres: {instances: 1, storage: 2Gi}
    events:
      url: nats://broker.dev.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: "{product}"
  stage:
    clusterName: stage
    argocdNamespace: cd-acme-shop
    applicationPrefix: "stage-{customer}-"
    appProject: "{cluster}-{customer}-shop"
    vendor: acme
    applicationLabels:
      acme.example.com/customer: "{customer}"
    chartRegistry: oci://registry.example.com/charts
    postgres: {instances: 1, storage: 2Gi}
    events:
      url: nats://broker.stage.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: "{product}"
products:
  dev-globex:
    interface: 15
    hostname: globex.shop.dev.example.com
  stage-globex:
    interface: 15
    hostname: globex.shop.stage.example.com
  dev-initech:
    interface: 15
    hostname: initech.shop.dev.example.com
  stage-initech:
    interface: 15
    hostname: initech.shop.stage.example.com
pipeline:
  project:
    name: "cd-{vendor}-{project}"
    vendor: acme
    customers: [globex, initech]
    noAutoPromote: [stage-globex]
  argocd:
    namespace: cd-acme-shop
  git:
    repoURL: https://git.example.com/acme/gitops.git
  promotion:
    pinFile: "projects/{product}/{customer}/{stage}/pin.yaml"
    commitMessage: "chore({product}): promote {version} to {stage} for {customer}"
    prTitle: "chore({product}): promote to {stage} for {customer}"
  graph:
    applicationName: "{stage}-{customer}-{app}"
    upstreams:
      stage: [dev]
platformDigest: "7992839f11cf77dbaea24c74703f1989ccc9d496913817ef23f92af1fcbf5f93"
