# Preview builds on the first Stage of a product with several customers. The
# release is an api chart for each customer and a static bundle for all of
# them; every commit also publishes both to a preview registry. Each
# customer's Warehouse of the source `preview`, shop-<customer>-preview,
# subscribes to its preview chart (globex names its own, initech takes
# project.sources.preview) and to the preview bundle
# (companions.web.sources.preview). dev-<customer> takes that Warehouse, and
# its installs take every ring from the preview chart's repository and serve
# the bundle from the preview repository; stage-<customer> takes the released
# Warehouse straight (no upstream) and installs released artifacts.
# stage-initech is dormant.

# Company files.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    infraChart: oci://registry.example.com/charts/shop-infra
    semver: ">=1.0.0 <2.0.0"
  sources:
    preview:
      chart: oci://preview.example.com/charts/shop
      semver: ">=1.0.0-0 <2.0.0"
  companions:
    web:
      artifact: registry.example.com/static/shop/web
      semver: ">=1.0.0"
      sources:
        preview:
          artifact: preview.example.com/static/shop/web
          semver: ">=1.0.0-0"
  customers:
    - name: globex
      chart: oci://registry.example.com/charts/shop-globex
      sources:
        preview: oci://preview.example.com/charts/shop-globex
    - name: initech
      companions:
        web:
          semver: ">=1.0.0 <2.0.0"
  clusters: [dev, stage]
  pipeline:
    stageOrder: [dev, stage]
    stageSources: {dev: preview}
    upstreams: {stage: []}
pins:
  dev-globex: "1.4.0"
  dev-globex-web: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
  stage-globex: "1.3.2"
  stage-globex-web: "sha256:2222222222222222222222222222222222222222222222222222222222222222"
  dev-initech: "1.4.1"
  dev-initech-web: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
  stage-initech: ""
  stage-initech-web: ""
values:
  dev-globex:
    app:
      config:
        greeting: hello globex
  dev-globex-web:
    app:
      site: {notFoundPage: 404.html}

# The platform's valuesObject.
clusters:
- dev
- stage
platform:
  dev:
    clusterName: dev
    argocdNamespace: cd-acme-shop
    applicationPrefix: dev-{customer}-
    appProject: '{cluster}-{customer}-shop'
    vendor: acme
    applicationLabels:
      acme.example.com/customer: '{customer}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.dev.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
  stage:
    clusterName: stage
    argocdNamespace: cd-acme-shop
    applicationPrefix: stage-{customer}-
    appProject: '{cluster}-{customer}-shop'
    vendor: acme
    applicationLabels:
      acme.example.com/customer: '{customer}'
    chartRegistry: oci://registry.example.com/charts
    postgres:
      instances: 1
      storage: 2Gi
    events:
      url: nats://broker.stage.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: '{product}'
products:
  dev-globex:
    interface: 15
    hostname: globex.shop.dev.example.com
  stage-globex:
    interface: 15
    hostname: globex.shop.stage.example.com
  dev-initech:
    interface: 15
    hostname: initech.shop.dev.example.com
  stage-initech:
    interface: 15
    hostname: initech.shop.stage.example.com
  dev-globex-web:
    chartVersion: 3.12.0
    platformValues:
      app:
        registry:
          auth: ecr
  stage-globex-web:
    chartVersion: 3.12.0
    platformValues:
      app:
        registry:
          auth: ecr
  dev-initech-web:
    chartVersion: 3.12.0
    platformValues:
      app:
        registry:
          auth: ecr
  stage-initech-web:
    chartVersion: 3.12.0
    platformValues:
      app:
        registry:
          auth: ecr
pipeline:
  project:
    name: cd-{vendor}-{project}
    vendor: acme
    customers:
    - globex
    - initech
  argocd:
    namespace: cd-acme-shop
  git:
    repoURL: https://git.example.com/acme/gitops.git
  promotion:
    pinFile: projects/{product}/{customer}/{stage}/pin.yaml
    commitMessage: 'chore({product}): promote {version} to {stage} for {customer}'
    prTitle: 'chore({product}): promote to {stage} for {customer}'
  graph:
    applicationName: '{stage}-{customer}-{app}'
    upstreams:
      stage:
      - dev
platformDigest: 60a6f190b26cf9bfb2faf9d6a70c35641cbf94d78f77e91956d45c1c3d06565e
