# Stages that take releases only. The project's Warehouse discovers release
# candidates (the range ends in -0). The company keeps them out of stage in
# its own file (project.pipeline.noPrereleases) and the platform keeps them
# out of dev in what it seals (pipeline.project.noPrereleases). The promotion
# of each Stage starts with a `fail` step that refuses a chart version with a
# prerelease part; nothing else of the render differs from the same project
# without the two lists.

# Company files.
project:
  name: shop
  source:
    chart: oci://registry.example.com/charts/shop
    semver: ">=1.0.0-0 <2.0.0"
  clusters: [dev, stage]
  pipeline:
    stageOrder: [dev, stage]
    noPrereleases: [stage]
pins:
  dev: "1.4.0"
  stage: "1.3.2"
values:
  dev:
    app:
      config:
        greeting: hello

# The platform's valuesObject.
clusters: [dev, stage]
platform:
  dev:
    clusterName: dev
    argocdNamespace: argocd
    applicationPrefix: "dev-"
    appProject: "{product}-{cluster}"
    chartRegistry: oci://registry.example.com/charts
    postgres: {instances: 1, storage: 2Gi}
    events:
      url: nats://broker.dev.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: "{product}"
  stage:
    clusterName: stage
    argocdNamespace: argocd
    applicationPrefix: "stage-"
    appProject: "{product}-{cluster}"
    chartRegistry: oci://registry.example.com/charts
    postgres: {instances: 1, storage: 2Gi}
    events:
      url: nats://broker.stage.example.com:4222
      storage: file
      replicas: 1
      maxAge: 24h
      account: "{product}"
products:
  dev:
    interface: 15
    hostname: shop.dev.example.com
  stage:
    interface: 15
    hostname: shop.stage.example.com
pipeline:
  project:
    noPrereleases: [dev]
  git:
    repoURL: https://git.example.com/acme/shop-delivery.git
  promotion:
    pinFile: "pins/{stage}.yaml"
  graph:
    upstreams:
      stage: [dev]
platformDigest: "f4ce205b93d4897de47bbe257aed2f94a9dc5290cbd2eae1dad5be0ab211eff9"
