# Artifacts that move together in one Freight: an api chart and a static
# bundle deployed by digest. `shop` has two customers, each with a Warehouse
# subscribing to its own api chart and to the shared bundle; initech holds the
# bundle to the 1.x line in its own Warehouse alone. Each Stage writes the
# chart's pin (pins.<stage>-<customer>) and the bundle's digest beside it
# (pins.<stage>-<customer>-web) in one yaml-update, so in one commit, and
# watches both parts' Applications.
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
graph:
  upstreams:
    stage: [dev]
  applicationName: "{stage}-{customer}-{app}"
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop/api
      semver: ">=1.0.0 <2.0.0"
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
    customers:
      - name: globex
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-globex
          semver: ">=1.0.0 <2.0.0"
      - name: initech
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-initech
          semver: ">=1.0.0 <2.0.0"
        companions:
          web:
            semver: ">=1.0.0 <2.0.0"
    applications: [shop-api, shop-web]
    stageOrder: [dev, stage]
