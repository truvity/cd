# A release of a static bundle alone: the product's api is not delivered
# here yet, so the project has a companion and no chart. Each customer's
# Warehouses subscribe to the bundle alone (shop-<customer> to the released
# one, shop-<customer>-preview to the preview builds, companions.web.sources),
# each Stage writes the bundle's digest alone (pins.<stage>-<customer>-web)
# and checks it alone, and watches the bundle's Application. Adding a chart
# later adds its subscription, pin and check beside these, and moves none.
promotedVersion:
  gateImage: ghcr.io/example/promotion-gate@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
graph:
  upstreams:
    stage: [dev]
    prod: [stage]
  applicationName: "{stage}-{customer}-{app}"
  promotedVersion: true
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    sources:
      preview: {}
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
        sources:
          preview:
            repoURL: oci://preview.example.com/static/shop/web
            semver: ">=1.0.0-0"
    customers: [globex, initech]
    applications: [shop-web]
    stageOrder: [dev, stage, prod]
    stageSources: {dev: preview}
    upstreams: {stage: []}
