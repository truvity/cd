# A missing pin file seeded by the first promotion (promotion.seedPinFile):
# each Stage writes its pin file, with the chart's key and the companion's
# beside it, each "" (dormant), before yaml-update. file-write refuses an
# existing file and continueOnError lets the promotion go on, so a Stage that
# has its file promotes as before. The values are the companions case's.
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
  seedPinFile: true
graph:
  upstreams:
    stage: [dev]
  applicationName: "{stage}-{customer}-{app}"
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop/api
      semver: ">=1.0.0 <2.0.0"
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
    customers:
      - name: globex
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-globex
          semver: ">=1.0.0 <2.0.0"
      - name: initech
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-initech
          semver: ">=1.0.0 <2.0.0"
        companions:
          web:
            semver: ">=1.0.0 <2.0.0"
    applications: [shop-api, shop-web]
    stageOrder: [dev, stage]
