# Preview builds on the first Stage of a product with several customers: an
# api chart for each customer and a static bundle shared by all of them, both
# released to one registry and built from every commit into another. Each
# customer has two Warehouses: shop-<customer> on its released chart and the
# released bundle, and shop-<customer>-preview on its preview chart (globex
# names its own, initech takes the project's sources.preview) and the preview
# bundle (companions.web.sources.preview). dev-<customer> takes the preview
# Warehouse and promotes on its own; stage-<customer> has no upstream, so it
# takes the released Warehouse straight and promotes by pull request; and
# prod-<customer> takes what stage-<customer> runs. Each Stage writes the
# chart's pin and the bundle's digest in one commit, reading each from the
# Freight by the repository of its own Warehouse.
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
graph:
  upstreams:
    stage: [dev]
    prod: [stage]
  applicationName: "{stage}-{customer}-{app}"
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop/api
      semver: ">=1.0.0 <2.0.0"
    sources:
      preview:
        repoURL: oci://preview.example.com/charts/shop/api
        semver: ">=1.0.0-0 <2.0.0"
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
        sources:
          preview:
            repoURL: oci://preview.example.com/static/shop/web
            semver: ">=1.0.0-0"
    customers:
      - name: globex
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-globex
          semver: ">=1.0.0 <2.0.0"
        sources:
          preview:
            repoURL: oci://preview.example.com/charts/shop/api-globex
            semver: ">=1.0.0-0 <2.0.0"
      - name: initech
    applications: [shop-api, shop-web]
    stageOrder: [dev, stage, prod]
    stageSources: {dev: preview}
    upstreams: {stage: []}
