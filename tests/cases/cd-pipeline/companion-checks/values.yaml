# The promoted-version check for each part of a release: beside the api
# chart's check, each Stage verifies the bundle by its digest, in a check of
# its own (ARTIFACT_REF, EXPECTED from the Stage's `web-digest` argument), so
# a part that none of the Stage's Applications renders fails on its own
# instead of being skipped. The shop of tests/cases/cd-pipeline/companions,
# with graph.promotedVersion on and the Go check image.
promotedVersion:
  gateImage: ghcr.io/example/promotion-gate@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
git:
  repoURL: https://git.example.com/acme/gitops.git
promotion:
  pinFile: "projects/{slug}/{customer}/{stage}/pin.yaml"
  pinKey: "pins.{stage}-{customer}"
graph:
  promotedVersion: true
  upstreams:
    stage: [dev]
  applicationName: "{stage}-{customer}-{app}"
projects:
  - name: cd-acme-shop
    slug: shop
    vendor: acme
    warehouse:
      name: shop
    chart:
      repoURL: oci://registry.example.com/charts/shop/api
      semver: ">=1.0.0 <2.0.0"
    companions:
      web:
        repoURL: oci://registry.example.com/static/shop/web
        semver: ">=1.0.0"
        subscribeAs: image
        pin: digest
    customers:
      - name: globex
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-globex
          semver: ">=1.0.0 <2.0.0"
      - name: initech
        chart:
          repoURL: oci://registry.example.com/charts/shop/api-initech
          semver: ">=1.0.0 <2.0.0"
        companions:
          web:
            semver: ">=1.0.0 <2.0.0"
    applications: [shop-api, shop-web]
    stageOrder: [dev, stage]
