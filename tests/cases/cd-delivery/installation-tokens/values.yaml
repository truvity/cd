# The platform names the vendor and the customer of an installation, and
# spells the Application's prefix, its AppProject and a label with them:
# east-globex-shop under the AppProject shop-east-globex. Everything else is
# cd-delivery/minimal.
platform:
  clusterName: east
  argocdNamespace: cd-acme-globex-shop
  applicationPrefix: "east-{customer}-"
  appProject: "{product}-{cluster}-{customer}"
  vendor: acme
  customer: globex
  applicationLabels:
    acme.example.com/installation: "{vendor}-{customer}-{product}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  shop:
    pin: 1.0.0
    interface: 1
    hostname: shop.example.com
