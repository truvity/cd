# A product of kind `chart` from an index repository: `repoURL` is the
# repository and `chart` the chart's name in it.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  tool:
    kind: chart
    pin: 2.3.4
    chart: tool-chart
    repository: https://charts.example.com
    values:
      app:
        logLevel: info
