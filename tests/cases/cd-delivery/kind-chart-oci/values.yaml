# A product of kind `chart`: one chart, one Application, named after the
# product. An `oci://` repository carries the chart in its address. `tool`
# takes the platform's registry and its own name; `gateway` names its chart and
# namespace; `shop` beside them is an ordinary three-ring product, unchanged.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  tool:
    kind: chart
    pin: 2.3.4
  gateway:
    kind: chart
    pin: 1.0.0
    chart: edge-gateway
    namespace: edge
    repository: oci://registry.example.com/platform
    values:
      app:
        replicas: 2
  shop:
    pin: 1.0.0
    interface: 1
    hostname: shop.example.com
