# A registry address with a port in artifact.ref is a repository, not a tag:
# the colon is followed by a path, so `host:5000/site` renders.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  docs:
    kind: static-site
    pin: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    chartVersion: 3.12.0
    artifact:
      ref: registry.example.com:5000/site
