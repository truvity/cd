# platformValues alone, with no layers: the platform's payload per ring,
# merged over what the chart composed and under the product's own `values`.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  shop:
    pin: 1.0.0
    interface: 1
    hostname: shop.example.com
    platformValues:
      infra:
        guarded: true
      app:
        greeting: platform
        nested: {first: platform, shared: platform}
    values:
      app:
        nested: {second: product, shared: product}
