# A platform that names the rings' Applications <product>-inf and <product>-app.
platform:
  # The Application names take their own ring suffixes; charts and releases keep theirs.
  applicationSuffixes: {infra: "-inf", app: "-app", e2e: "-app-e2e"}
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  shop:
    pin: 1.0.0
    interface: 1
    hostname: shop.example.com
