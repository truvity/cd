# The same kind without `platform.staticSite`: no label and no annotation
# is added to either Application, and `namespace` defaults to the name.
platform:
  clusterName: east
  argocdNamespace: argocd
  applicationPrefix: east-
  appProject: "{product}-{cluster}"
  chartRegistry: oci://registry.example.com/charts
  postgres:
    instances: 1
    storage: 2Gi
  events:
    url: nats://broker.example:4222
    storage: file
    replicas: 1
    maxAge: 24h
    account: "{product}"
products:
  docs:
    kind: static-site
    pin: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    chartVersion: 3.12.0
    artifact:
      ref: registry.example.com/sites/docs
