{{- $ns := .Values.namespace | default .Release.Namespace -}}
{{- $seen := dict -}}
{{- range $i, $c := .Values.clusters }}
{{- $name := required (printf "cd-cluster-registration: clusters[%d].name is required" $i) $c.name }}
{{- $secret := $c.secretName | default (printf "cluster-%s" $name) }}
{{- if hasKey $seen $secret }}
{{- fail (printf "cd-cluster-registration: two clusters render the Secret %s" $secret) }}
{{- end }}
{{- $_ := set $seen $secret true }}
{{- $server := required (printf "cd-cluster-registration: clusters[%s].server is required" $name) $c.server }}
{{- $config := toPrettyJson (required (printf "cd-cluster-registration: clusters[%s].config is required" $name) $c.config) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $ns }}
  labels:
    {{- with $c.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    argocd.argoproj.io/secret-type: cluster
  {{- with $c.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
{{- if $c.stringData }}
stringData:
  name: {{ $name | quote }}
  server: {{ $server | quote }}
  config: |
    {{- $config | nindent 4 }}
{{- else }}
data:
  name: {{ $name | b64enc }}
  server: {{ $server | b64enc }}
  config: {{ $config | b64enc }}
{{- end }}
{{- end }}
