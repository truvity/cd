# Argo CD's own metrics, scraped through the upstream chart's metrics
# Services and ServiceMonitors: the application controller (:8082), the API
# server (:8083) and the repo server (:8084). OPT-IN: layer this file before
# your own values. Needs the ServiceMonitor CRD (Prometheus Operator, or a
# VictoriaMetrics operator converting it).
argo-cd:
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
