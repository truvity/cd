{{- /*
Opt-in (a non-empty externalSecrets map). One ExternalSecret per key in the
release namespace, for the Secrets Argo CD reads (repository credentials,
a GitHub App key). `spec` is the ExternalSecret spec verbatim. The store is
the caller's: name it in each spec.secretStoreRef, or once in the top-level
secretStoreRef, which fills in any spec that has none. The chart creates no
SecretStore and no ClusterSecretStore: where the secrets live is not its
business. A spec with neither is refused.
*/ -}}
{{- range $name, $e := .Values.externalSecrets }}
{{- $spec := deepCopy $e.spec }}
{{- if not $spec.secretStoreRef }}
{{- if not $.Values.secretStoreRef }}
{{- fail (printf "externalSecrets.%s: no secretStoreRef — set it in the spec or at the top level (secretStoreRef: {kind, name})" $name) }}
{{- end }}
{{- $_ := set $spec "secretStoreRef" $.Values.secretStoreRef }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- include "cd-argocd.meta" (dict "name" $name "namespace" $.Release.Namespace "item" $e) | nindent 2 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
