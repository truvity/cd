{{- with .Values.viewer.global }}
{{- include "cd-pipeline.doc" (dict "apiVersion" "v1" "kind" "Namespace" "metadata" (include "cd-pipeline.meta" (dict "root" $ "name" $.Values.viewer.namespace "wave" $.Values.waves.project) | fromYaml)) }}
{{- include "cd-pipeline.doc" (dict "apiVersion" "v1" "kind" "ServiceAccount" "metadata" (include "cd-pipeline.meta" (dict "root" $ "name" $.Values.viewer.serviceAccount "ns" $.Values.viewer.namespace "wave" $.Values.waves.warehouse "annotations" (dict "rbac.kargo.akuity.io/claims" (toJson .claims))) | fromYaml)) }}
{{- end }}
{{- range $p := .Values.projects }}
{{- include "cd-pipeline.project" (dict "root" $ "p" $p) }}
{{- end }}
{{- /*
Opt-in (a non-empty appProjects map): the Argo CD AppProjects of the projects
the Stages watch. `spec` is verbatim; they land in argocd.namespace. The
chart-wide labels and annotations are the Kargo objects' guard and are not
put on them.
*/ -}}
{{- range $name, $ap := .Values.appProjects }}
{{- $meta := dict "name" $name "namespace" ($.Values.argocd.namespace | default "argocd") }}
{{- with $ap.labels }}{{- $_ := set $meta "labels" . }}{{- end }}
{{- with $ap.annotations }}{{- $_ := set $meta "annotations" . }}{{- end }}
{{- include "cd-pipeline.doc" (dict "apiVersion" "argoproj.io/v1alpha1" "kind" "AppProject" "metadata" $meta "spec" $ap.spec) }}
{{- end }}
