{{- $products := dict -}}
{{- range $kind := list "pins" "values" "products" -}}
  {{- range $service := keys (index $.Values $kind) | sortAlpha -}}
    {{- if not (has $service $.Values.services) -}}
      {{- fail (printf "cd-company: unknown service %q in %s (not in services)" $service $kind) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $service := .Values.services -}}
  {{- if not (hasKey $.Values.pins $service) -}}
    {{- fail (printf "cd-company: missing pins.%s (use an empty string for a dormant service)" $service) -}}
  {{- end -}}
  {{- $pin := index $.Values.pins $service -}}
  {{- if not (kindIs "string" $pin) -}}
    {{- fail (printf "cd-company: pins.%s must be a string" $service) -}}
  {{- end -}}
  {{- $values := index $.Values.values $service | default dict -}}
  {{- /* The kind of product decides which rings exist and which roots are
         reserved. A service without product facts yet is a product. */ -}}
  {{- $kind := dig "kind" "product" (index $.Values.products $service | default dict) -}}
  {{- /* What the platform sets through the product's platformValues and its
         open layers is reserved too, beside the fixed list. The pin is the
         company's, so the layers are resolved here, at render. */ -}}
  {{- $trees := list -}}
  {{- if hasKey $.Values.products $service -}}
    {{- $facts := deepCopy (index $.Values.products $service) -}}
    {{- $_ := set $facts "pin" $pin -}}
    {{- $trees = (include "cd-company.platformPayloadTrees" (dict "name" $service "product" $facts) | fromYaml).trees -}}
  {{- end -}}
  {{- range $ring, $payload := $values -}}
    {{- if not (has $ring (list "infra" "app" "e2e")) -}}
      {{- fail (printf "cd-company: values.%s: unknown ring %q" $service $ring) -}}
    {{- end -}}
    {{- if not (has $ring (splitList " " (include "cd-company.kindRings" $kind))) -}}
      {{- fail (printf "cd-company: values.%s.%s: kind %s takes values.app only" $service $ring $kind) -}}
    {{- end -}}
    {{- include "cd-company.assertOwnership" (dict "path" (printf "values.%s.%s" $service $ring) "payload" $payload "owned" (include "cd-company.owned" (dict "kind" $kind "ring" $ring) | fromYaml)) -}}
    {{- range $reserved := $trees -}}
      {{- if eq $reserved.ring $ring -}}
        {{- include "cd-company.assertOwnership" (dict "path" (printf "values.%s.%s" $service $ring) "payload" $payload "owned" $reserved.tree) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if ne $pin "" -}}
    {{- if not (hasKey $.Values.products $service) -}}
      {{- fail (printf "cd-company: missing products.%s for non-dormant service" $service) -}}
    {{- end -}}
    {{- $product := deepCopy (index $.Values.products $service) -}}
    {{- $_ := set $product "pin" $pin -}}
    {{- $_ := set $product "values" $values -}}
    {{- $_ := set $products $service $product -}}
  {{- end -}}
{{- end -}}
{{- include "cd-delivery.applications" (dict "platform" .Values.platform "products" $products) -}}
